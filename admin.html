<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — QIST</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-16a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="rule">Admin panel</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-outline" href="curate.html">Curate opportunities →</a>
        <button class="btn btn-primary" id="btn-add-person">＋ Add researcher</button>
      </div>
    </div>

    <!-- The curator screen works without a backend: it edits data/opportunities.json in the
         browser and hands the file back to commit. Everything below this line needs the API. -->
    <p class="small muted" style="margin-bottom:18px;max-width:70ch">
      Opportunities are curated on their own screen, which works with no server:
      <a href="curate.html">curate.html</a>. The tables below read and write the QIST API and
      stay disabled until a backend is deployed.
    </p>

    <div class="tab-row" style="margin-bottom:24px">
      <button class="active" data-tab="people">Researchers</button>
      <button data-tab="members">Members database</button>
      <button data-tab="moderation">Positions &amp; papers</button>
      <button data-tab="posts">Posts</button>
      <button data-tab="subs">Subscribers</button>
      <button data-tab="requests">Collab requests</button>
    </div>

    <div id="tab-people" class="table-wrap"></div>
    <div id="tab-members" class="table-wrap" style="display:none"></div>
    <div id="tab-moderation" class="table-wrap" style="display:none"></div>
    <div id="tab-posts" class="table-wrap" style="display:none"></div>
    <div id="tab-subs" class="table-wrap" style="display:none"></div>
    <div id="tab-requests" class="table-wrap" style="display:none"></div>
  </div>
</section>

<div class="modal-overlay" id="person-modal">
  <div class="modal">
    <button class="close" onclick="document.getElementById('person-modal').classList.remove('open')">✕</button>
    <h2 id="pm-title" style="margin-bottom:16px">Add researcher</h2>
    <form id="person-form">
      <input type="hidden" id="pf-id">
      <div class="form-grid">
        <div class="form-row"><label>Full name</label><input type="text" id="pf-name" required style="width:100%"></div>
        <div class="form-row"><label>Title</label><input type="text" id="pf-title" style="width:100%" placeholder="Assistant Professor"></div>
        <div class="form-row"><label>Institution</label><input type="text" id="pf-inst" style="width:100%"></div>
        <div class="form-row"><label>Experience (years)</label><input type="number" id="pf-exp" min="0" max="60" style="width:100%"></div>
        <div class="form-row"><label>City</label><input type="text" id="pf-city" style="width:100%"></div>
        <div class="form-row"><label>Country</label><input type="text" id="pf-country" style="width:100%"></div>
        <div class="form-row"><label>Latitude</label><input type="number" step="any" id="pf-lat" style="width:100%"></div>
        <div class="form-row"><label>Longitude</label><input type="number" step="any" id="pf-lng" style="width:100%"></div>
      </div>
      <div class="form-row"><label>Research topics (comma-separated)</label><input type="text" id="pf-topics" style="width:100%"></div>
      <div class="form-row"><label>Public link</label><input type="url" id="pf-link" style="width:100%" placeholder="https://scholar.google.com/…"></div>
      <div class="form-row"><label>Short bio</label><textarea id="pf-bio" rows="3"></textarea></div>
      <button class="btn btn-primary" type="submit">Save</button>
    </form>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-16a"></script>
<script src="assets/js/app.js?v=2026-10-16a"></script>
<script>
(async () => {
  await QIST.boot('admin.html');

  // The admin console edits server data. Without a server it edited localStorage,
  // so only the administrator ever saw the changes. Disabled 2026-09-18.
  if (!QIST.authAvailable()) {
    document.querySelector('.container').innerHTML = `
      <div class="card" style="padding:30px 32px;margin-top:26px">
        <h2 style="margin-bottom:10px">The admin console needs a server</h2>
        <p class="small muted" style="margin-bottom:8px">
          Changes used to be saved in the administrator's own browser and never reached the site.
          The console now switches on only when the backend is running.
        </p>
        <p class="small muted" style="margin-bottom:18px">
          Opportunities are edited in <code>data/opportunities.json</code> for now — see the README.
        </p>
        <a class="btn btn-outline" href="index.html">Back to home</a>
      </div>`;
    return;
  }
  const u = QIST.requireRole('admin');
  if (!u) return;
  const $ = id => document.getElementById(id);

  document.querySelectorAll('.tab-row button').forEach(b =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.tab-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      ['people', 'members', 'moderation', 'posts', 'subs', 'requests'].forEach(t =>
        $('tab-' + t).style.display = t === b.dataset.tab ? '' : 'none');
    }));

  /* ---------- members database: everyone who created a profile, searchable, exportable ---------- */
  const authed = path => fetch(QIST.apiBase + path, { headers: QIST.authHeaders() });
  let members = [];
  function drawMembers() {
    const q = ($('mem-q') ? $('mem-q').value : '').trim().toLowerCase();
    const rows = members.filter(m => !q || JSON.stringify(m).toLowerCase().includes(q));
    $('mem-body').innerHTML = rows.map(m => `<tr>
      <td><b>${QIST.esc(m.name)}</b><br><span class="muted small">${QIST.esc(m.email)}</span></td>
      <td>${QIST.esc(m.title || '')}<br><span class="muted small">${QIST.esc(m.institution || '')}</span></td>
      <td>${QIST.esc([m.city, m.country].filter(Boolean).join(', '))}</td>
      <td class="small">${m.orcid ? `<a href="https://orcid.org/${QIST.esc(m.orcid)}" target="_blank" rel="noopener">${QIST.esc(m.orcid)}</a>` : ''}</td>
      <td class="small">${QIST.esc((m.fields || []).join('; '))}</td>
      <td>${m.papers}</td><td>${m.positions}</td><td>${m.listed === false ? 'no' : 'yes'}</td>
      <td class="small">${QIST.esc((m.created || '').slice(0, 10))}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">No members yet.</td></tr>';
    $('mem-count').textContent = `${rows.length} / ${members.length}`;
  }
  async function renderMembers() {
    members = await (await authed('/api/admin/members')).json();
    $('tab-members').innerHTML = `<div class="toolbar" style="margin:0 0 14px"><input type="text" id="mem-q" placeholder="Search name, e-mail, institution, field…" style="flex:1 1 280px">
      <span class="muted small" id="mem-count"></span><button class="btn btn-outline btn-sm" id="mem-csv">Export CSV</button></div>
      <table class="data"><thead><tr><th>Member</th><th>Title / institution</th><th>Location</th><th>ORCID</th><th>Fields</th><th>Papers</th><th>Positions</th><th>Listed</th><th>Joined</th></tr></thead><tbody id="mem-body"></tbody></table>`;
    $('mem-q').addEventListener('input', drawMembers);
    $('mem-csv').addEventListener('click', async () => {
      const r = await authed('/api/admin/export.csv');
      const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'qist-members.csv'; a.click(); URL.revokeObjectURL(a.href);
    });
    drawMembers();
  }

  /* ---------- moderation: anything a member posted can be removed here ---------- */
  async function renderModeration() {
    const [pos, pap] = await Promise.all([fetch(QIST.apiBase + '/api/positions').then(r => r.json()), fetch(QIST.apiBase + '/api/papers?limit=500').then(r => r.json())]);
    $('tab-moderation').innerHTML = `<h3 style="margin-bottom:8px">Positions (${pos.length})</h3>
      <table class="data"><tr><th>Title</th><th>Lab</th><th>Posted by</th><th>Deadline</th><th></th></tr>${pos.map(p => `<tr>
        <td><a href="${QIST.esc(p.source_url)}" target="_blank" rel="noopener">${QIST.esc(p.title)}</a></td><td class="small">${QIST.esc(p.organization)}</td>
        <td class="small">${QIST.esc(p.posted_by)}</td><td class="small">${QIST.esc(p.deadline || '')}</td>
        <td><button class="btn btn-danger btn-sm" data-mod="positions/${QIST.esc(p.id.split('-')[1])}">Remove</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">None.</td></tr>'}</table>
      <h3 style="margin:26px 0 8px">Papers (${pap.length})</h3>
      <table class="data"><tr><th>Title</th><th>Venue</th><th>Added by</th><th></th></tr>${pap.map(p => `<tr>
        <td>${QIST.esc(p.title)}</td><td class="small">${QIST.esc(p.venue || '')} ${QIST.esc(p.year || '')}</td><td class="small">${QIST.esc(p.added_by)}</td>
        <td><button class="btn btn-danger btn-sm" data-mod="papers/${QIST.esc(p.id.split('-')[1])}">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">None.</td></tr>'}</table>`;
    $('tab-moderation').querySelectorAll('[data-mod]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Remove this from the platform?')) return;
      const r = await fetch(QIST.apiBase + '/api/' + b.dataset.mod, { method: 'DELETE', headers: QIST.authHeaders() });
      QIST.toast(r.ok ? 'Removed.' : 'Could not remove.'); renderModeration();
    }));
  }

  /* ---------- people ---------- */
  async function renderPeople() {
    const people = await QIST.getPeople();
    $('tab-people').innerHTML = `<table class="data">
      <tr><th>Name</th><th>Title / Institution</th><th>Location</th><th>Topics</th><th></th></tr>
      ${people.map(p => `<tr>
        <td><b>${QIST.esc(p.name)}</b></td>
        <td>${QIST.esc(p.title || '')}<br><span class="muted">${QIST.esc(p.institution || '')}</span></td>
        <td>${QIST.esc(p.city || '')}, ${QIST.esc(p.country || '')}</td>
        <td class="small">${(p.topics || []).map(QIST.esc).join(', ')}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-outline btn-sm" data-edit="${QIST.esc(p.id)}">Edit</button>
          <button class="btn btn-danger btn-sm" data-del="${QIST.esc(p.id)}">Remove</button>
        </td>
      </tr>`).join('')}
    </table>`;

    $('tab-people').querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', async () => {
        const p = (await QIST.getPeople()).find(x => String(x.id) === b.dataset.edit);
        $('pm-title').textContent = 'Edit researcher';
        $('pf-id').value = p.id;
        $('pf-name').value = p.name; $('pf-title').value = p.title || '';
        $('pf-inst').value = p.institution || ''; $('pf-exp').value = p.experience ?? '';
        $('pf-city').value = p.city || ''; $('pf-country').value = p.country || '';
        $('pf-lat').value = p.lat ?? ''; $('pf-lng').value = p.lng ?? '';
        $('pf-topics').value = (p.topics || []).join(', ');
        $('pf-link').value = p.link || ''; $('pf-bio').value = p.bio || '';
        $('person-modal').classList.add('open');
      }));

    $('tab-people').querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', () => {
        if (!confirm('Remove this researcher from the directory?')) return;
        const id = b.dataset.del;
        if (String(id).startsWith('loc_')) {
          QIST.saveOverlay('people', QIST.overlay('people').filter(p => String(p.id) !== id));
        } else {
          const removed = QIST.overlay('removed_people');
          removed.push(id);
          QIST.saveOverlay('removed_people', removed);
        }
        QIST.toast('Researcher removed.');
        renderPeople();
      }));
  }

  $('btn-add-person').addEventListener('click', () => {
    $('pm-title').textContent = 'Add researcher';
    $('person-form').reset(); $('pf-id').value = '';
    $('person-modal').classList.add('open');
  });

  $('person-form').addEventListener('submit', e => {
    e.preventDefault();
    const rec = {
      name: $('pf-name').value.trim(), title: $('pf-title').value.trim(),
      institution: $('pf-inst').value.trim(),
      experience: $('pf-exp').value ? +$('pf-exp').value : null,
      city: $('pf-city').value.trim(), country: $('pf-country').value.trim(),
      lat: $('pf-lat').value ? +$('pf-lat').value : null,
      lng: $('pf-lng').value ? +$('pf-lng').value : null,
      topics: $('pf-topics').value.split(',').map(s => s.trim()).filter(Boolean),
      link: $('pf-link').value.trim(), bio: $('pf-bio').value.trim()
    };
    const id = $('pf-id').value;
    if (!id) {
      QIST.pushOverlay('people', rec);
    } else if (String(id).startsWith('loc_')) {
      QIST.saveOverlay('people', QIST.overlay('people').map(p => String(p.id) === id ? { ...p, ...rec } : p));
    } else {
      rec.id = id;
      const edits = QIST.overlay('edited_people').filter(p => String(p.id) !== id);
      edits.push(rec);
      QIST.saveOverlay('edited_people', edits);
    }
    $('person-modal').classList.remove('open');
    QIST.toast('Saved.');
    renderPeople();
  });

  /* ---------- posts ---------- */
  async function renderPosts() {
    const posts = await QIST.getPosts();
    $('tab-posts').innerHTML = `<table class="data">
      <tr><th>Date</th><th>Channel</th><th>Title</th><th>Author</th><th></th></tr>
      ${posts.map(p => `<tr>
        <td>${QIST.esc(p.date || '')}</td><td>#${QIST.esc(p.channel)}</td>
        <td><b>${QIST.esc(p.title)}</b></td><td>${QIST.esc(p.author || '')}</td>
        <td><button class="btn btn-danger btn-sm" data-delpost="${QIST.esc(p.id)}">Remove</button></td>
      </tr>`).join('')}
    </table>`;
    $('tab-posts').querySelectorAll('[data-delpost]').forEach(b =>
      b.addEventListener('click', () => {
        const id = b.dataset.delpost;
        if (String(id).startsWith('loc_')) {
          QIST.saveOverlay('posts', QIST.overlay('posts').filter(p => String(p.id) !== id));
        } else {
          const removed = QIST.overlay('removed_posts');
          removed.push(id);
          QIST.saveOverlay('removed_posts', removed);
        }
        QIST.toast('Post removed.');
        renderPosts();
      }));
  }

  /* ---------- accounts / subscribers / requests ---------- */
  function renderRest() {
    // (the old Accounts tab listed demo accounts that no longer exist; the Members database replaces it)
    const subs = QIST.overlay('subscribers');
    $('tab-subs').innerHTML = subs.length
      ? `<table class="data"><tr><th>Email</th></tr>${subs.map(s => `<tr><td>${QIST.esc(s.email)}</td></tr>`).join('')}</table>`
      : '<p class="muted">No newsletter subscribers recorded on this device yet.</p>';

    const reqs = QIST.overlay('collab_requests');
    $('tab-requests').innerHTML = reqs.length
      ? `<table class="data"><tr><th>Date</th><th>From</th><th>To</th><th>Topics</th><th>Goal</th></tr>
        ${reqs.map(r => `<tr><td>${QIST.esc(r.date)}</td><td>${QIST.esc(r.from)}</td>
        <td>${QIST.esc(r.toName)}</td><td>${QIST.esc(r.topics)}</td><td>${QIST.esc(r.goal)}</td></tr>`).join('')}</table>`
      : '<p class="muted">No collaboration requests recorded on this device yet.</p>';
  }

  await renderPeople();
  await renderPosts();
  renderRest();
  renderMembers().catch(e => { $('tab-members').textContent = 'Could not load members: ' + e.message; });
  renderModeration().catch(() => {});
})();
</script>
</body>
</html>
