<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="opp.h2">Opportunities · ScienceBridge AI</title>
<meta name="description" content="Grants, consortium roles, academic and industry positions and co-author calls, each checked against your country and career stage with a link to the funder's rules.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-12a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="container">
  <div class="page-top">
    <div><span class="photo-num" id="top-num" style="background-image:url('assets/img/tiles-samarkand.jpg')" aria-hidden="true">17</span><span class="unit" data-i18n="top.opps"></span></div>
    <div>
      <h1 data-i18n="opp.h2">Opportunities</h1>
      <p class="lede" data-i18n="opp.lede"></p>
      <p class="aside" id="opp-summary" aria-live="polite"></p>
    </div>
  </div>
</div>

<div class="container">

  <!-- the reader's profile, said as a sentence: the verdicts depend on it -->
  <div class="profile-bar lifted">
    <p class="sentence">
      <span data-i18n="home.s.a"></span>
      <select id="of-stage" data-i18n-attr="aria-label:opp.mystage">
        <option value="any" data-i18n="opp.stage.any">Student / Master's</option>
        <option value="phd_student" data-i18n="opp.stage.phd_student">PhD candidate</option>
        <option value="phd_plus" selected data-i18n="opp.stage.phd_plus">PhD / Researcher</option>
        <option value="postdoc_plus" data-i18n="opp.stage.postdoc_plus">Postdoc</option>
        <option value="pi_only" data-i18n="opp.stage.pi_only">Professor / PI</option>
      </select><span data-i18n="home.s.b"></span><select id="of-country" data-i18n-attr="aria-label:opp.mycountry"></select><span data-i18n="opp.s.c"></span><select id="of-myfield" data-i18n-attr="aria-label:opp.myfield"></select>
    </p>
    <p class="hint" data-i18n="opp.profile.note"></p>
  </div>

  <div class="toolbar" id="opp-filters">
    <span class="search-wrap"><input type="text" id="of-q" class="search-input" data-slash aria-keyshortcuts="/" data-i18n-attr="placeholder:opp.search.ph;aria-label:opp.search.ph"><kbd aria-hidden="true">/</kbd></span>
    <select id="of-field" data-i18n-attr="aria-label:common.allfields"><option value="" data-i18n="common.allfields">All research fields</option></select>
    <select id="of-sort" data-i18n-attr="aria-label:opp.sort.deadline">
      <option value="deadline" data-i18n="opp.sort.deadline"></option>
      <option value="match" data-i18n="opp.sort.match"></option>
    </select>
    <div class="checks-row">
      <label class="check"><input type="checkbox" id="of-elig"> <span data-i18n="opp.onlyelig">Only what I am eligible for</span></label>
      <label class="check"><input type="checkbox" id="of-open" checked> <span data-i18n="opp.hideexpired">Hide expired</span></label>
    </div>
  </div>
  <div class="seg" id="of-types" role="group" data-i18n-attr="aria-label:opp.alltypes"></div>

  <div class="deadlines" id="deadlines" hidden>
    <div class="deadlines-head"><span id="tl-title"></span><span class="later" id="tl-later"></span></div>
    <div class="tl" id="tl"></div>
  </div>

  <p class="count-line" id="opp-count" data-i18n="common.loading">Loading…</p>
  <div class="rows" id="opp-list"></div>

</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-12a"></script>
<script src="assets/js/app.js?v=2026-10-12a"></script>
<script>
(async () => {
  await QIST.boot('opportunities.html');

  const $ = id => document.getElementById(id);
  const list = $('opp-list'), count = $('opp-count');

  /* Deploy guard. This page needs helpers and data files that ship together with it.
     When only part of a release reaches the server, a missing helper used to throw and
     leave a blank page with no explanation. Now we say what is out of date. */
  function outOfDate(what) {
    count.textContent = '';
    list.innerHTML = `<div class="card pad-lg opp-empty">
      <h3>${QIST.t('opp.stale.h')}</h3>
      <p class="small muted">Missing or outdated: <code>${QIST.esc(what)}</code>.
        Upload the whole release together — <code>assets/js/app.js</code>,
        <code>data/eligibility.json</code> and <code>data/opportunities.json</code> must match this page.</p>
      <p class="small muted">This page expects build <code>2026-10-12a</code>; the server has
        <code>${QIST.esc(QIST.BUILD || 'older than 2026-10-12a')}</code>.</p>
    </div>`;
  }
  if (typeof QIST.fillCountrySelect !== 'function' || !QIST.PRIMARY_FIELDS
      || typeof QIST.fieldsMatch !== 'function' || typeof QIST.oppFieldCounts !== 'function'
      || typeof QIST.matchOpportunity !== 'function' || typeof QIST.condChips !== 'function') {
    console.error('opportunities.html: assets/js/app.js is older than this page');
    return outOfDate('assets/js/app.js');
  }

  /* ---------- data loading: explicit loading and error states ---------- */
  let opps, elig;
  try {
    [opps, elig] = await Promise.all([QIST.getOpportunities(), QIST.getEligibility()]);
  } catch (err) {
    console.error('Failed to load opportunities:', err);
    count.textContent = '';
    list.innerHTML = `<div class="card pad-lg opp-empty">
      <h3>${QIST.t('opp.err.h')}</h3>
      <p class="small muted">${QIST.t('opp.err.p')}</p>
      <button class="btn btn-outline" onclick="location.reload()">${QIST.t('common.reload')}</button></div>`;
    return;
  }

  /* ---------- populate the lookups ---------- */
  if (!elig.priority_countries || Object.keys(elig.countries || {}).length < 50) {
    console.error('opportunities.html: data/eligibility.json is older than this page');
    return outOfDate('data/eligibility.json');
  }
  QIST.fillCountrySelect($('of-country'), elig, 'KZ');

  /* All 35 QIST research fields, always in the same order; fields with nothing behind them
     are disabled rather than hidden, so the gaps in coverage stay visible. */
  const fieldCounts = QIST.oppFieldCounts(opps);
  QIST.PRIMARY_FIELDS.forEach(f => {
    const n = fieldCounts[f] || 0;
    $('of-field').insertAdjacentHTML('beforeend',
      `<option value="${QIST.esc(f)}"${n ? '' : ' disabled'}>${QIST.esc(f)}${n ? ` (${n})` : ''}</option>`);
  });

  /* The reader's own field feeds the match analysis, not the filter: "show me AI calls" and
     "I am an AI researcher" are different questions. */
  $('of-myfield').insertAdjacentHTML('beforeend', `<option value="">${QIST.t('opp.s.anyfield')}</option>`);
  QIST.PRIMARY_FIELDS.forEach(f =>
    $('of-myfield').insertAdjacentHTML('beforeend', `<option value="${QIST.esc(f)}">${QIST.esc(f)}</option>`));

  /* ---------- state lives in the URL ---------- */
  const IDS = { country: 'of-country', stage: 'of-stage', myfield: 'of-myfield', q: 'of-q', field: 'of-field', sort: 'of-sort' };
  const TYPES = [...new Set(opps.map(o => o.type))];
  let type = '';
  const langParam = new URLSearchParams(location.search).get('lang');
  function readUrl() {
    const p = new URLSearchParams(location.search);
    Object.entries(IDS).forEach(([k, id]) => { if (p.has(k)) $(id).value = p.get(k); });
    if (p.has('type') && TYPES.includes(p.get('type'))) type = p.get('type');
    if (p.has('elig')) $('of-elig').checked = p.get('elig') === '1';
    if (p.has('open')) $('of-open').checked = p.get('open') === '1';
  }
  function writeUrl() {
    const p = new URLSearchParams();
    if (langParam) p.set('lang', langParam);
    Object.entries(IDS).forEach(([k, id]) => { if ($(id).value && !(k === 'sort' && $(id).value === 'deadline')) p.set(k, $(id).value); });
    if (type) p.set('type', type);
    if ($('of-elig').checked) p.set('elig', '1');
    if (!$('of-open').checked) p.set('open', '0');
    history.replaceState(null, '', (p.toString() ? '?' + p : location.pathname) + location.hash);
  }
  readUrl();
  ['of-stage', 'of-country', 'of-myfield'].forEach(id => QIST.fitSelect($(id)));

  function readerProfile() {
    const f = $('of-myfield').value;
    return { country: $('of-country').value, stage: $('of-stage').value, fields: f ? [f] : [], methods: [] };
  }

  /* ---------- one call ---------- */
  function row(o, profile) {
    const m = QIST.matchOpportunity(o, profile, elig);
    const expired = QIST.isExpired(o);
    const blocker = m.criteria.find(x => x.blocking && !x.ok && !x.unknown);
    const panelId = `why-${QIST.esc(o.id)}`;

    /* One row per requirement the call states, with the reason and, where the verdict came
       from a published list, the link it came from. */
    const checks = m.criteria.map(x => {
      const cls = x.unknown ? 'unk' : x.ok ? 'ok' : 'bad';
      const mark = x.unknown ? '?' : x.ok ? '✓' : '✗';
      const src = x.source
        ? ` <a class="src" href="${QIST.esc(x.source.url)}" target="_blank" rel="noopener">${QIST.t('elig.source')}${x.source.version ? ' ' + QIST.esc(x.source.version) : ''}${x.source.date ? ', ' + QIST.esc(x.source.date) : ''} ${QIST.icon('external')}</a>` : '';
      return `<tr><td>${QIST.esc(x.label)}${x.blocking ? '' : ` ${QIST.t('match.soft')}`}</td>
        <td>${QIST.esc(x.detail)}${src}</td><td><span class="mark ${cls}" aria-hidden="true">${mark}</span></td></tr>`;
    }).join('');

    const fields = o.all_fields ? QIST.t('opp.allfieldstag') : (o.fields || []).join(', ');
    const meta = [
      `<span class="opp-fund opp-fund-${QIST.esc(o.funding_status)}">${QIST.esc(QIST.fundingLabel(o.funding_status))}</span>`,
      o.role_expected ? `<span>${QIST.esc(o.role_expected)}${o.workload ? ' · ' + QIST.esc(o.workload) : ''}</span>` : '',
      fields ? `<span>${QIST.esc(fields)}</span>` : ''
    ].join('');

    return `<article class="opp opp-${m.tone}${expired ? ' is-expired' : ''}" id="opp-${QIST.esc(o.id)}" data-opp="${QIST.esc(o.id)}">
      ${QIST.whenCell(o)}
      <div class="opp-main">
        <p class="opp-line">
          <span class="opp-type">${QIST.esc(QIST.typeLabel(o.type))}</span>
          <span>${QIST.esc(o.organization)}</span>
          ${o.city ? `<span>${QIST.icon('pin')} ${QIST.esc(o.city)}</span>` : ''}
        </p>
        <h3>${QIST.esc(o.title)}</h3>
        <p class="opp-sum">${QIST.esc(o.summary)}</p>
        ${QIST.condChips(m, profile, elig)}
        ${blocker ? `<p class="opp-blocker">${QIST.esc(blocker.detail)}</p>` : ''}
        <p class="opp-meta">${meta}</p>
        <div class="opp-foot">
          <button type="button" class="opp-toggle" aria-expanded="false" aria-controls="${panelId}">${QIST.t('opp.details')}</button>
          <span class="spacer"></span>
          <button class="btn btn-quiet btn-sm" data-dismiss="${QIST.esc(o.id)}">${QIST.t('opp.dismiss')}</button>
          ${o.source_url ? `<a class="btn btn-outline btn-sm" href="${QIST.esc(o.source_url)}" target="_blank" rel="noopener">${QIST.t('opp.source')} ${QIST.icon('external')}</a>` : ''}
          <button class="btn btn-primary btn-sm" data-interest="${QIST.esc(o.id)}"${expired ? ' disabled' : ''}>${QIST.t('opp.interested')}</button>
        </div>
        <div class="opp-panel" id="${panelId}" hidden>
          <p class="opp-panel-verdict">${QIST.esc(m.verdict)}</p>
          <table class="checks"><tbody>${checks}</tbody></table>
          ${o.eligibility && o.eligibility.note ? `<p class="opp-note">${QIST.t('opp.fundercond', { note: QIST.esc(o.eligibility.note) })}</p>` : ''}
          <p class="opp-caveat">${QIST.t('match.caveat')} ${QIST.t('opp.sourcelang')}</p>
        </div>
      </div>
    </article>`;
  }

  const dismissed = new Set();

  function passes(o, profile, ignoreType) {
    const q = $('of-q').value.trim().toLowerCase();
    const field = $('of-field').value;
    if (dismissed.has(o.id)) return false;
    if (!ignoreType && type && o.type !== type) return false;
    if (field && !QIST.fieldsMatch(o, field)) return false;
    if ($('of-open').checked && QIST.isExpired(o)) return false;
    // "Only what I can apply to" hides anything with a blocking failure: country, career
    // stage, or a deadline that has already passed.
    if ($('of-elig').checked && QIST.matchOpportunity(o, profile, elig).blocked) return false;
    if (q) {
      const hay = `${o.title} ${o.organization} ${o.summary} ${(o.fields || []).join(' ')} ${(o.methods_required || []).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  /* Closing soonest first by default; the file order used to decide what was on top. Calls
     with no deadline come after dated ones, closed calls last. */
  function sorted(list, profile) {
    const byDate = (a, b) => (QIST.isExpired(a) - QIST.isExpired(b)) ||
      ((a.deadline || '9999') .localeCompare(b.deadline || '9999'));
    if ($('of-sort').value !== 'match') return [...list].sort(byDate);
    const score = o => { const m = QIST.matchOpportunity(o, profile, elig); return (m.blocked ? -1000 : 0) + m.pct; };
    return [...list].sort((a, b) => score(b) - score(a) || byDate(a, b));
  }

  function drawTypes(profile) {
    const base = opps.filter(o => passes(o, profile, true));
    const btn = (value, label, n) =>
      `<button type="button" data-type="${value}" aria-pressed="${type === value}">${QIST.esc(label)} <span class="n">${n}</span></button>`;
    $('of-types').innerHTML = btn('', QIST.t('opp.type.all'), base.length) +
      TYPES.map(t => [t, base.filter(o => o.type === t).length])
        .filter(([t, n]) => n || t === type)
        .map(([t, n]) => btn(t, QIST.typeLabel(t), n)).join('');
  }

  function render() {
    writeUrl();
    const profile = readerProfile();
    const active = opps.filter(o => !QIST.isExpired(o));
    const fit = active.filter(o => !QIST.matchOpportunity(o, profile, elig).blocked).length;
    $('opp-summary').innerHTML = QIST.t('opp.summary', { open: `<b>${active.length}</b>`, fit: `<b>${fit}</b>` });
    $('top-num').textContent = active.length;

    drawTypes(profile);
    const shown = sorted(opps.filter(o => passes(o, profile)), profile);
    count.innerHTML = shown.length ? QIST.t('opp.count', { shown: `<b>${shown.length}</b>`, total: opps.length }) : '';
    const html = shown.length
      ? shown.map(o => row(o, profile)).join('')
      : `<div class="empty">
           <h3>${QIST.t('opp.empty.h')}</h3>
           <p>${QIST.t('opp.empty.p', { n: opps.length })}</p>
           <button class="btn btn-outline" id="opp-reset">${QIST.t('common.clear')}</button>
         </div>`;
    QIST.flashChanges(list, () => { list.innerHTML = html; });
    drawTimeline(shown, profile);
    const reset = $('opp-reset');
    if (reset) reset.addEventListener('click', () => {
      $('of-q').value = ''; $('of-field').value = ''; type = '';
      $('of-elig').checked = false; $('of-open').checked = true;
      render();
    });
  }

  /* ---------- deadlines ahead ---------- */
  const DAYS = 120;
  function monthLabel(d) {
    const KK = ['қаң', 'ақп', 'нау', 'сәу', 'мам', 'мау', 'шіл', 'там', 'қыр', 'қаз', 'қар', 'жел'];
    if (QIST.lang === 'kk') return KK[d.getMonth()];
    try { return new Intl.DateTimeFormat(QIST.lang, { month: 'short' }).format(d); } catch (_) { return d.getMonth() + 1; }
  }
  function drawTimeline(shown, profile) {
    const box = $('deadlines'), tl = $('tl');
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dated = shown.filter(o => o.deadline && !QIST.isExpired(o));
    const inRange = dated.filter(o => QIST.daysLeft(o) <= DAYS);
    box.hidden = !inRange.length;
    if (!inRange.length) return;
    const x = days => `${(Math.max(0, days) / DAYS) * 100}%`;
    let html = '<span class="tl-axis"></span><span class="tl-today" style="left:0"></span>';
    for (let i = 0; i <= 4; i++) {
      const m = new Date(today.getFullYear(), today.getMonth() + i, 1);
      const d = Math.round((m - today) / 86400000);
      if (d > 0 && d < DAYS) html += `<span class="tl-month" style="left:${x(d)}">${QIST.esc(monthLabel(m))}</span>`;
    }
    const stack = {};
    inRange.sort((a, b) => a.deadline.localeCompare(b.deadline)).forEach(o => {
      const n = QIST.daysLeft(o), wk = Math.floor(n / 6);
      const level = stack[wk] = (stack[wk] || 0) + 1;
      const tone = QIST.matchOpportunity(o, profile, elig).tone;
      html += `<button type="button" class="tl-dot ${tone}" data-go="${QIST.esc(o.id)}" style="left:${x(n)};bottom:${15 + (level - 1) * 16}px"
        aria-label="${QIST.esc(o.title)}, ${QIST.esc(QIST.t('opp.deadline.days', { n }))}"
        data-title="${QIST.esc(o.title)}" data-when="${QIST.esc(QIST.t('opp.deadline.days', { n }))}"></button>`;
    });
    tl.innerHTML = html;
    $('tl-title').innerHTML = QIST.t('opp.tl.h', { n: `<b>${inRange.length}</b>` });
    const later = dated.length - inRange.length;
    $('tl-later').textContent = later ? QIST.t('opp.tl.later', { n: later }) : '';
  }
  const tipOn = e => {
    const dot = e.target.closest('.tl-dot'); if (!dot) return;
    tipOff();
    const pos = parseFloat(dot.style.left);
    const edge = pos < 18 ? ' at-start' : pos > 82 ? ' at-end' : '';
    dot.insertAdjacentHTML('afterend', `<span class="tl-tip${edge}" style="left:${dot.style.left};bottom:${parseInt(dot.style.bottom) + 18}px">${dot.dataset.title}<span>${dot.dataset.when}</span></span>`);
  };
  const tipOff = () => { const t = $('tl').querySelector('.tl-tip'); if (t) t.remove(); };
  $('tl').addEventListener('mouseover', tipOn);
  $('tl').addEventListener('focusin', tipOn);
  $('tl').addEventListener('mouseleave', tipOff);
  $('tl').addEventListener('focusout', tipOff);
  $('tl').addEventListener('click', e => {
    const dot = e.target.closest('[data-go]'); if (!dot) return;
    const row = document.getElementById('opp-' + dot.dataset.go);
    if (!row) return;
    toggle(row.querySelector('.opp-toggle'), true);
    // land just below the sticky profile bar, not under it
    const bar = document.querySelector('.profile-bar');
    const barBottom = (parseFloat(getComputedStyle(bar).top) || 0) + bar.offsetHeight + 16;
    window.scrollTo({ top: row.getBoundingClientRect().top + scrollY - barBottom, behavior: QIST.reducedMotion() ? 'auto' : 'smooth' });
  });

  /* ---------- actions ---------- */
  function toggle(btn, open) {
    btn.setAttribute('aria-expanded', String(open));
    $(btn.getAttribute('aria-controls')).hidden = !open;
  }
  $('of-types').addEventListener('click', e => {
    const b = e.target.closest('[data-type]');
    if (!b) return;
    type = b.dataset.type; render();
  });
  list.addEventListener('click', async (e) => {
    const tog = e.target.closest('.opp-toggle');
    if (tog) { toggle(tog, tog.getAttribute('aria-expanded') !== 'true'); return; }

    const dis = e.target.closest('[data-dismiss]');
    if (dis) { dismissed.add(dis.dataset.dismiss); render(); QIST.toast(QIST.t('opp.toast.dismiss')); return; }

    const btn = e.target.closest('[data-interest]');
    if (!btn) return;
    const o = opps.find(x => x.id === btn.dataset.interest);
    btn.disabled = true; btn.textContent = QIST.t('common.sending');
    const res = await QIST.recordInterest(o, { country: $('of-country').value, stage: $('of-stage').value });
    if (res.ok) {
      btn.textContent = QIST.t('opp.interested.ok');
      QIST.toast(QIST.t('opp.toast.sent'));
    } else {
      btn.disabled = false; btn.textContent = QIST.t('opp.interested');
      QIST.toast(QIST.t(res.reason === 'not_configured' ? 'opp.toast.noendpoint' : 'opp.toast.fail'));
    }
  });

  ['of-country', 'of-stage', 'of-myfield'].forEach(id => $(id).addEventListener('change', () => { QIST.fitSelect($(id)); render(); }));
  ['of-field', 'of-sort', 'of-elig', 'of-open'].forEach(id => $(id).addEventListener('change', render));
  $('of-q').addEventListener('input', render);

  render();

  /* The profile bar sticks under the header; once it does, it drops its hint line. */
  const bar = document.querySelector('.profile-bar');
  const onScroll = () => bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= parseFloat(getComputedStyle(bar).top) + 1);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* A link from the home page lands on one call (#opp-<id>): open its conditions and bring
     it into view. */
  const target = location.hash.startsWith('#opp-') && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (target) {
    toggle(target.querySelector('.opp-toggle'), true);
    target.scrollIntoView({ block: 'start' });
  }
})();
</script>
</body>
</html>
