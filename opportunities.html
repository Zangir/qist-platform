<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="nav.opportunities">Opportunities · ScienceBridge AI</title>
<meta name="description" content="Grants, academic vacancies, collaborations and members' papers, ranked for your fields, keywords and career stage, with eligibility checked against your country and the funder's published rules.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-17a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="container">
  <div class="page-top">
    <div><span class="photo-num" id="top-num" style="background-image:url('assets/img/steppe-fieldwork.jpg')" aria-hidden="true">0</span><span class="unit" id="top-unit"></span></div>
    <div>
      <h1 data-i18n="nav.opportunities">Opportunities</h1>
      <p class="lede" data-i18n="opp2.lede"></p>
    </div>
  </div>
</div>

<div class="container">
  <section class="profile-bar" id="pf" aria-labelledby="pf-h">
    <div class="pf-head">
      <p class="pf-line" id="pf-line"></p>
      <button type="button" class="btn btn-outline btn-sm" id="pf-toggle" aria-expanded="false" aria-controls="pf-form" data-i18n="feed.profile.edit">Edit profile</button>
    </div>
    <form class="pf-form" id="pf-form" hidden autocomplete="off" onsubmit="return false">
      <h2 id="pf-h" class="sr-only" data-i18n="feed.profile.h">Your research profile</h2>
      <div class="row-2">
        <div><label for="pf-stage" data-i18n="feed.f.stage">Career stage</label>
          <select id="pf-stage">
            <option value="any" data-i18n="opp.stage.any">Student / Master's</option>
            <option value="phd_student" data-i18n="opp.stage.phd_student">PhD candidate</option>
            <option value="phd_plus" data-i18n="opp.stage.phd_plus">PhD / Researcher</option>
            <option value="postdoc_plus" data-i18n="opp.stage.postdoc_plus">Postdoc</option>
            <option value="pi_only" data-i18n="opp.stage.pi_only">Professor / PI</option>
          </select></div>
        <div><label for="pf-country" data-i18n="feed.f.country">Based in</label><select id="pf-country"></select></div>
      </div>
      <div><span class="lab" id="pf-fields-l" data-i18n="feed.f.fields">Research fields</span><div class="fchips" id="pf-fields" role="group" aria-labelledby="pf-fields-l"></div></div>
      <div><label for="pf-kw" data-i18n="feed.f.keywords">Keywords</label>
        <input type="text" id="pf-kw" data-i18n-attr="placeholder:feed.f.keywords.ph">
        <p class="hint" data-i18n="feed.f.keywords.hint"></p></div>
      <div class="row-2">
        <div><label for="pf-jc" data-i18n="feed.f.jobcountries">Vacancies in these countries</label>
          <select id="pf-jc"></select><div class="cchips" id="pf-jc-chips"></div>
          <p class="hint" data-i18n="feed.f.jobcountries.hint"></p></div>
        <div style="display:grid;gap:12px;align-content:start;padding-top:26px">
          <label class="check"><input type="checkbox" id="pf-remote"> <span data-i18n="feed.f.remote">Also show remote roles</span></label>
          <label class="check"><input type="checkbox" id="pf-allstages"> <span data-i18n="feed.f.allstages">Include vacancies above or below my stage</span></label>
        </div>
      </div>
      <div class="pf-actions">
        <button type="submit" class="btn btn-primary" data-i18n="feed.profile.save">Save and refresh</button>
        <button type="button" class="btn btn-quiet" id="pf-reset" data-i18n="opp2.profile.clear">Clear profile</button>
        <button type="button" class="btn btn-quiet" id="pf-cancel" data-i18n="feed.profile.close">Close</button>
        <span class="state" id="pf-state" role="status" aria-live="polite"></span>
      </div>
      <p class="hint" id="pf-where"></p>
    </form>
  </section>

  <div class="toolbar">
    <span class="search-wrap"><input type="text" id="q" class="search-input" data-slash aria-keyshortcuts="/" data-i18n-attr="placeholder:opp2.search.ph;aria-label:opp2.search.ph"><kbd aria-hidden="true">/</kbd></span>
    <button type="button" class="btn btn-outline btn-sm" id="clear" data-i18n="common.clear">Clear</button>
    <div class="checks-row">
      <label class="check"><input type="checkbox" id="inelig"> <span data-i18n="opp2.showinelig">Also show calls I cannot apply to</span></label>
    </div>
  </div>

  <div id="notice" aria-live="polite"></div>
  <div class="seg feed-tabs" id="tabs" role="tablist"></div>

  <div class="tab-actions" id="tab-actions"></div>

  <section class="feed-sec" id="picks" hidden>
    <h2 data-i18n="feed.picks">Today's picks</h2>
    <p class="sub" id="picks-sub"></p>
    <div class="rows" id="picks-list"></div>
  </section>

  <div class="feed-bar">
    <h2 id="all-h" data-i18n="feed.all">All matches</h2>
    <div class="right">
      <span class="count-line" id="count" role="status" aria-live="polite"></span>
      <select id="sort" data-i18n-attr="aria-label:feed.sort.match"></select>
    </div>
  </div>
  <div class="rows" id="list"></div>
  <div class="more" id="more" hidden><button type="button" class="btn btn-outline" id="more-btn" data-i18n="feed.more">Show more</button></div>
  <p class="feed-caveat" id="caveat"></p>
  <p class="feed-status" id="status"></p>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-17a"></script>
<script src="assets/js/app.js?v=2026-10-17a"></script>
<script src="assets/js/feed.js?v=2026-10-17a"></script>
<script>
(async () => {
  await QIST.boot('opportunities.html');
  const F = QIST.feed, $ = id => document.getElementById(id);
  const TODAY = new Date().toISOString().slice(0, 10);
  const PAGE = 20;
  const TABS = ['grant', 'job', 'collab', 'paper', 'saved'];

  let loaded, elig;
  try {
    [loaded, elig] = await Promise.all([F.load(), QIST.getEligibility()]);
  } catch (e) {
    console.error('opportunities load failed', e);
    $('list').innerHTML = `<div class="empty"><h3>${QIST.t('feed.err')}</h3><button class="btn btn-outline" onclick="location.reload()">${QIST.t('common.reload')}</button></div>`;
    return;
  }
  const { meta, data, failed } = loaded;

  /* ---------- state ---------- */
  let profile = F.loadProfile();
  const remote = await F.pullRemoteProfile();
  if (remote) profile = F.saveProfile(remote);
  const hadProfile = F.hasProfile();
  const prevVisit = F.touchVisit(TODAY);
  const since = prevVisit || new Date(Date.now() - 2 * 86400000).toISOString().slice(0, 10);
  const params = new URLSearchParams(location.search);
  /* A link from the home page can carry a country and stage ("what fits a PhD in Kazakhstan"). They apply to this
     view only; they are not written over the reader's saved profile. */
  const asked = {};
  if (params.get('country') && elig.countries[params.get('country')]) asked.country = params.get('country');
  if (F.sanitizeProfile({ stage: params.get('stage') }).stage === params.get('stage')) asked.stage = params.get('stage');
  const view = () => Object.assign({}, profile, asked);
  let tab = TABS.includes(params.get('tab')) ? params.get('tab') : 'grant';
  let limit = PAGE, ranked = {};
  $('q').value = params.get('q') || '';
  $('inelig').checked = params.get('elig') === '0';

  /* ---------- profile form ---------- */
  const form = $('pf-form');
  QIST.fillCountrySelect($('pf-country'), elig, view().country || 'KZ');
  $('pf-jc').innerHTML = `<option value="">${QIST.esc(QIST.t('feed.f.jobcountries.add'))}</option>` +
    Object.keys(elig.countries).sort((a, b) => QIST.countryName(a, elig).localeCompare(QIST.countryName(b, elig), QIST.lang))
      .map(c => `<option value="${c}">${QIST.esc(QIST.countryName(c, elig))}</option>`).join('');
  let draft = JSON.parse(JSON.stringify(profile));

  function drawChips() {
    $('pf-fields').innerHTML = QIST.PRIMARY_FIELDS.filter(f => f !== 'Other Research Area').map(f => {
      const on = draft.fields.includes(f);
      return `<button type="button" data-f="${QIST.esc(f)}" aria-pressed="${on}"${!on && draft.fields.length >= 6 ? ' disabled' : ''}>${QIST.esc(f)}</button>`;
    }).join('');
    $('pf-jc-chips').innerHTML = draft.jobCountries.map(c =>
      `<button type="button" data-c="${c}" aria-label="${QIST.esc(QIST.countryName(c, elig))}">${QIST.esc(QIST.countryName(c, elig))}</button>`).join('');
  }
  function fillForm() {
    draft = JSON.parse(JSON.stringify(view()));
    $('pf-stage').value = draft.stage;
    $('pf-kw').value = draft.keywords.join(', ');
    $('pf-remote').checked = draft.remote;
    $('pf-allstages').checked = draft.allStages;
    $('pf-country').value = draft.country || 'KZ';
    drawChips();
    $('pf-where').textContent = QIST.apiAlive && QIST.currentUser() ? QIST.t('feed.stored.account') : QIST.t('feed.stored.local');
  }
  $('pf-fields').addEventListener('click', e => {
    const b = e.target.closest('button[data-f]'); if (!b) return;
    const f = b.dataset.f, i = draft.fields.indexOf(f);
    if (i > -1) draft.fields.splice(i, 1); else if (draft.fields.length < 6) draft.fields.push(f);
    drawChips();
    $('pf-fields').querySelector(`[data-f="${CSS.escape(f)}"]`)?.focus();
  });
  $('pf-jc').addEventListener('change', e => {
    const c = e.target.value;
    if (c && !draft.jobCountries.includes(c) && draft.jobCountries.length < 8) draft.jobCountries.push(c);
    e.target.value = ''; drawChips();
  });
  $('pf-jc-chips').addEventListener('click', e => {
    const b = e.target.closest('button[data-c]'); if (!b) return;
    draft.jobCountries = draft.jobCountries.filter(c => c !== b.dataset.c); drawChips();
  });
  function setOpen(open) {
    form.hidden = !open;
    $('pf-toggle').setAttribute('aria-expanded', String(open));
    if (open) fillForm();
  }
  $('pf-toggle').addEventListener('click', () => setOpen(form.hidden));
  $('pf-cancel').addEventListener('click', () => { setOpen(false); $('pf-toggle').focus(); });
  /* "Clear profile" empties the form, so a reader can start a new search from nothing; it is saved only on Save. */
  $('pf-reset').addEventListener('click', () => {
    draft = Object.assign(F.defaultProfile(), { country: $('pf-country').value });
    $('pf-kw').value = ''; $('pf-stage').value = draft.stage; $('pf-remote').checked = true; $('pf-allstages').checked = false;
    drawChips();
    $('pf-state').textContent = QIST.t('opp2.profile.cleared');
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    profile = F.saveProfile({
      stage: $('pf-stage').value, country: $('pf-country').value, fields: draft.fields,
      keywords: $('pf-kw').value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean),
      jobCountries: draft.jobCountries, remote: $('pf-remote').checked, allStages: $('pf-allstages').checked
    });
    Object.keys(asked).forEach(k => delete asked[k]);
    await F.pushRemoteProfile(profile);
    $('pf-state').textContent = QIST.t('feed.profile.saved');
    limit = PAGE;
    renderAll();
    setTimeout(() => { setOpen(false); $('pf-state').textContent = ''; $('pf-toggle').focus(); }, 600);
  });

  /* ---------- rendering ---------- */
  const kindLabel = k => QIST.t('opp2.tab.' + k);

  function profileLine() {
    const v = view();
    const bits = [`<b>${QIST.esc(QIST.t('opp.stage.' + v.stage))}</b>`];
    if (v.country) bits.push(QIST.esc(QIST.countryName(v.country, elig)));
    const topics = v.fields.concat(v.keywords);
    if (topics.length) bits.push(QIST.esc(topics.slice(0, 5).join(', ')) + (topics.length > 5 ? ` +${topics.length - 5}` : ''));
    $('pf-line').innerHTML = bits.join(' · ');
  }

  function whenCell(it) {
    if (it.curated && it.deadline) return QIST.whenCell(it.opp);
    if (it.kind === 'paper') {
      return `<div class="when plain"><b>${QIST.esc(it.year || '')}</b><span>${QIST.esc(it.venue ? '' : QIST.t('opp2.paper'))}</span></div>`;
    }
    if (it.deadline) return QIST.whenCell(it);
    const ref = it.posted || it.first_seen;
    const n = ref ? Math.max(0, Math.round((Date.now() - new Date(ref + 'T00:00:00Z')) / 86400000)) : null;
    let d = ref || '';
    try { d = new Intl.DateTimeFormat(QIST.lang === 'kk' ? 'ru' : QIST.lang, { day: 'numeric', month: 'short' }).format(new Date(ref + 'T00:00:00Z')); } catch (_) {}
    const label = n === null ? QIST.t('opp.col.none') : n === 0 ? QIST.t('feed.today') : QIST.t('feed.ago', { n });
    return `<div class="when plain"><b>${QIST.esc(ref ? d : '—')}</b><span>${QIST.esc(label)}</span></div>`;
  }

  function metaLine(it) {
    const bits = [];
    if (it.kind === 'paper') {
      if (it.authors && it.authors.length) bits.push(it.authors.slice(0, 4).join(', ') + (it.authors.length > 4 ? ' et al.' : ''));
      if (it.venue) bits.push(it.venue);
      if (it.added_by) bits.push(QIST.t('opp2.addedby', { n: it.added_by }));
    } else if (it.kind === 'job') {
      if (it.department) bits.push(it.department);
      if (it.location) bits.push(it.location);
      if (it.salary) bits.push(it.salary);
    } else if (it.curated) {
      if (it.opp.funding_status && it.origin !== 'community') bits.push(QIST.fundingLabel(it.opp.funding_status));
      if (it.opp.role_expected) bits.push(it.opp.role_expected);
      if (it.location) bits.push(it.location);
    } else {
      if (it.amount) bits.push(it.amount);
      if (it.status === 'forthcoming' || it.status === 'forecasted') bits.push(it.status);
    }
    return bits.map(b => `<span>${QIST.esc(b)}</span>`).join('');
  }

  /* The reasons an eligibility verdict rests on, one row per condition, with the funder's own source where the
     verdict came from a published list. */
  function eligPanel(m, it) {
    const checks = m.criteria.map(x => {
      const cls = x.unknown ? 'unk' : x.ok ? 'ok' : 'bad', mark = x.unknown ? '?' : x.ok ? '✓' : '✗';
      const src = x.source
        ? ` <a class="src" href="${QIST.esc(/^https?:\/\//i.test(x.source.url || '') ? x.source.url : '#')}" target="_blank" rel="noopener">${QIST.t('elig.source')}${x.source.version ? ' ' + QIST.esc(x.source.version) : ''}${x.source.date ? ', ' + QIST.esc(x.source.date) : ''} ${QIST.icon('external')}</a>` : '';
      return `<tr><td>${QIST.esc(x.label)}${x.blocking ? '' : ` ${QIST.t('match.soft')}`}</td><td>${QIST.esc(x.detail)}${src}</td><td><span class="mark ${cls}" aria-hidden="true">${mark}</span></td></tr>`;
    }).join('');
    const note = it.opp.eligibility && it.opp.eligibility.note ? `<p class="opp-note">${QIST.t('opp.fundercond', { note: QIST.esc(it.opp.eligibility.note) })}</p>` : '';
    return `<p class="opp-panel-verdict">${QIST.esc(m.verdict)}</p><table class="checks"><tbody>${checks}</tbody></table>${note}
      <p class="opp-caveat">${QIST.t('match.caveat')} ${QIST.t('opp.sourcelang')}</p>`;
  }

  function card(r, withKind) {
    const it = r.item, saved = F.isSaved(it.id), v = view();
    const href = it.url && /^https?:\/\//i.test(it.url) ? it.url : '';
    const lead = [];
    if (withKind) lead.push(`<span class="kind">${QIST.esc(kindLabel(it.kind))}</span>`);
    if (it.curated) lead.push(`<span class="opp-type">${QIST.esc(QIST.typeLabel(it.type))}</span>`);
    if (it.origin === 'community') lead.push(`<span class="tag">${QIST.t('opp2.member')}</span>`);
    if (it.org) lead.push(`<span>${QIST.esc(it.org)}</span>`);
    if (r.isNew) lead.push(`<span class="tag tag-new">${QIST.t('feed.new')}</span>`);
    if (!it.curated && it.source) lead.push(`<span class="feed-source">${QIST.esc(it.source)}</span>`);

    /* A green tick means "this fits you": field, keyword, stage, place. "Checked by QIST" and the venue are facts about
       the item, and the deadline is already in the date column, so none of them gets a tick. */
    const chips = (r.reasons || []).filter(x => x.kind !== 'soon').map(x =>
      x.kind === 'venue' || x.kind === 'verified' ? `<span class="tag">${QIST.esc(x.text)}</span>` : `<span class="cond ok">${QIST.esc(x.text)}</span>`).join('');

    let elig = '', panel = '';
    const m = r.m;
    if (it.curated && m) {
      const blocker = m.criteria.find(x => x.blocking && !x.ok && !x.unknown);
      elig = QIST.condChips(m, { country: v.country, stage: v.stage }, elig_) +
             (blocker ? `<p class="opp-blocker">${QIST.esc(blocker.detail)}</p>` : '');
      panel = `<div class="opp-panel" id="why-${QIST.esc(it.id)}" hidden>${eligPanel(m, it)}</div>`;
    } else if (it.kind === 'grant') {
      elig = `<p class="opp-unchecked">${QIST.t('opp2.unchecked')}</p>`;
    }
    const doi = it.kind === 'paper' && it.doi ? `<span>DOI ${QIST.esc(it.doi)}</span>` : '';

    return `<article class="opp feed-item${m && m.blocked ? ' opp-bad' : ''}" id="opp-${QIST.esc(it.id)}" data-id="${QIST.esc(it.id)}">
      ${whenCell(it)}
      <div class="opp-main">
        <p class="opp-line">${lead.join('')}</p>
        <h3>${href ? `<a href="${QIST.esc(href)}" target="_blank" rel="noopener">${QIST.esc(it.title)}</a>` : QIST.esc(it.title)}</h3>
        ${it.summary ? `<p class="opp-sum">${QIST.esc(it.summary)}</p>` : ''}
        ${chips ? `<div class="conds">${chips}</div>` : ''}
        ${elig}
        <p class="opp-meta">${metaLine(it)}${doi}</p>
        <div class="opp-foot">
          ${it.curated && m ? `<button type="button" class="opp-toggle" aria-expanded="false" aria-controls="why-${QIST.esc(it.id)}">${QIST.t('opp.details')}</button>` : ''}
          <button type="button" class="btn btn-outline btn-sm" data-save="${QIST.esc(it.id)}" aria-pressed="${saved}">${QIST.t(saved ? 'feed.saved' : 'feed.save')}</button>
          ${saved ? '' : `<button type="button" class="btn btn-quiet btn-sm" data-dismiss="${QIST.esc(it.id)}">${QIST.t('feed.dismiss')}</button>`}
          <span class="spacer"></span>
          ${it.curated && it.kind !== 'paper' && it.origin !== 'community' ? `<button type="button" class="btn btn-outline btn-sm" data-interest="${QIST.esc(it.id)}">${QIST.t('opp.interested')}</button>` : ''}
          ${href ? `<a class="btn btn-primary btn-sm" href="${QIST.esc(href)}" target="_blank" rel="noopener">${QIST.t('feed.open')} ${QIST.icon('external')}</a>` : ''}
        </div>
        ${panel}
      </div>
    </article>`;
  }
  const elig_ = elig;

  function rankAll() {
    const sort = $('sort').value || 'match';
    const o = { since, sort, elig, showIneligible: $('inelig').checked, q: $('q').value.trim() };
    F.KINDS.forEach(k => { ranked[k] = F.rank(data[k] || [], view(), o); });
    ranked.saved = F.savedItems().filter(it => !o.q || F.textMatch(it, o.q)).map(item => ({ item, score: 0, reasons: [], isNew: false,
      m: item.curated ? QIST.matchOpportunity(item.opp, { country: view().country, stage: view().stage, fields: view().fields, methods: [] }, elig) : null }));
  }

  function drawTabs() {
    const btn = (k, n, nw) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}" aria-pressed="${tab === k}">${QIST.esc(kindLabel(k))} <span class="n">${n}${nw ? ` · ${nw} ${QIST.esc(QIST.t('feed.new').toLowerCase())}` : ''}</span></button>`;
    $('tabs').innerHTML = F.KINDS.map(k => btn(k, ranked[k].length, k === 'paper' ? 0 : ranked[k].filter(r => r.isNew).length)).join('') + btn('saved', ranked.saved.length, 0);
  }
  function drawSort() {
    const opts = [['match', 'feed.sort.match'], ['new', 'feed.sort.new']];
    if (tab === 'grant' || tab === 'job' || tab === 'collab') opts.push(['soon', 'feed.sort.soon']);
    const cur = $('sort').value || 'match';
    $('sort').innerHTML = opts.map(([v, k]) => `<option value="${v}">${QIST.esc(QIST.t(k))}</option>`).join('');
    $('sort').value = opts.some(o => o[0] === cur) ? cur : 'match';
    $('sort').hidden = tab === 'saved';
  }
  function drawActions() {
    const signedIn = !!QIST.currentUser();
    const html = {
      job: `<a class="btn btn-primary btn-sm" href="post-position.html">${QIST.t('opp2.post')}</a><span class="muted small">${QIST.t('opp2.post.hint')}</span>`,
      paper: `<a class="btn btn-primary btn-sm" href="${signedIn ? 'profile.html#papers' : 'join.html'}">${QIST.t('opp2.addpaper')}</a><span class="muted small">${QIST.t('opp2.addpaper.hint')}</span>`
    }[tab] || '';
    $('tab-actions').innerHTML = html;
    $('tab-actions').hidden = !html;
  }

  function renderAll() {
    profileLine();
    rankAll();
    drawTabs(); drawSort(); drawActions();
    /* The headline number is what is new for this reader. With no profile yet nothing is "strong", so everything new counts;
       when nothing is new it falls back to everything that matches right now, never a bare 0 on a first visit. */
    const calls = ['grant', 'job', 'collab'], noProfile = F.prepare(view()).empty;
    const newN = calls.reduce((n, k) => n + ranked[k].filter(r => r.isNew && (noProfile || r.score >= 35)).length, 0);
    const allN = calls.reduce((n, k) => n + ranked[k].length, 0);
    $('top-num').textContent = newN || allN;
    $('top-unit').textContent = QIST.t(newN ? (prevVisit ? 'feed.unit.new' : 'feed.unit.first') : 'opp2.unit.total');
    $('notice').innerHTML = F.prepare(view()).empty
      ? `<div class="feed-notice"><b>${QIST.t('feed.empty.h')}</b> — ${QIST.t('feed.empty.p')}</div>` : '';
    renderList();
    const upd = (meta && meta.generated_at ? meta.generated_at.slice(0, 10) : null);
    const failing = meta ? Object.entries(meta.kinds || {}).flatMap(([k, v]) => Object.entries(v.sources || {}).filter(([, s]) => !s.ok).map(([n]) => n)) : [];
    $('status').textContent = [upd ? QIST.t('feed.status', { date: upd }) : '', failing.length ? QIST.t('feed.status.fail', { list: failing.join(', ') }) : ''].filter(Boolean).join(' ');
  }

  function renderList() {
    const all = ranked[tab] || [];
    $('caveat').textContent = tab === 'saved' ? '' : QIST.t('opp2.caveat.' + tab);
    $('all-h').textContent = tab === 'saved' ? QIST.t('opp2.tab.saved') : QIST.t('feed.all');
    const showPicks = tab !== 'saved' && tab !== 'paper' && all.length >= 3 && !$('q').value.trim();
    $('picks').hidden = !showPicks;
    let pickIds = new Set();
    if (showPicks) {
      const fresh = all.filter(r => r.isNew);
      const useNew = fresh.length >= 3;
      const pool = [...(useNew ? fresh : all)].sort((a, b) => b.score - a.score);
      const top = pool.slice(0, 5);
      pickIds = new Set(top.map(r => r.item.id));
      $('picks-sub').textContent = QIST.t(useNew ? 'feed.picks.new' : 'feed.picks.best');
      $('picks-list').innerHTML = top.map(r => card(r, false)).join('');
    }
    const rest = tab === 'saved' ? all : all.filter(r => !pickIds.has(r.item.id));
    const shown = rest.slice(0, limit);
    $('count').innerHTML = all.length ? QIST.t('feed.count', { shown: `<b>${Math.min(limit, rest.length) + pickIds.size}</b>`, total: all.length }) : '';
    if (!all.length) {
      const nodata = !(data[tab] || []).length;
      $('list').innerHTML = `<div class="empty"><h3>${QIST.t(nodata ? (tab === 'paper' ? 'opp2.nopapers' : 'feed.nodata') : 'feed.none')}</h3>
        ${F.isDismissedAny() ? `<button class="btn btn-outline" id="unhide">${QIST.t('feed.unhide')}</button>` : ''}
        ${$('q').value.trim() || $('inelig').checked ? `<button class="btn btn-outline" id="clear2">${QIST.t('common.clear')}</button>` : ''}</div>`;
    } else {
      $('list').innerHTML = shown.map(r => card(r, tab === 'saved')).join('');
    }
    $('more').hidden = rest.length <= limit;
    const p = new URLSearchParams();
    if (params.get('lang')) p.set('lang', params.get('lang'));
    p.set('tab', tab);
    if ($('q').value.trim()) p.set('q', $('q').value.trim());
    if ($('inelig').checked) p.set('elig', '0');
    ['country', 'stage'].forEach(k => { if (asked[k]) p.set(k, asked[k]); });
    history.replaceState(null, '', '?' + p + location.hash);
  }

  /* A link such as opportunities.html#opp-o-p3 (from the home page) opens the right tab and scrolls to the call. */
  function goToHash() {
    const m = location.hash.match(/^#opp-(.+)$/); if (!m) return;
    const id = decodeURIComponent(m[1]);
    const k = F.KINDS.find(k => (data[k] || []).some(it => it.id === id));
    if (!k) return;
    // a call the reader cannot apply to is hidden by default; a link to it (the home page's board) must still land on it
    if (!(ranked[k] || []).some(r => r.item.id === id) && !$('inelig').checked) { $('inelig').checked = true; renderAll(); }
    if (tab !== k) { tab = k; limit = PAGE; drawTabs(); drawSort(); drawActions(); }
    // make sure it is in the visible page of results
    const idx = (ranked[k] || []).findIndex(r => r.item.id === id);
    if (idx >= limit) limit = idx + 1;
    renderList();
    const el = document.getElementById('opp-' + id);
    if (!el) return;
    const t = el.querySelector('.opp-toggle'); if (t) toggle(t, true);
    el.scrollIntoView({ behavior: QIST.reducedMotion() ? 'auto' : 'smooth', block: 'center' });
    el.classList.add('flash');
  }

  function toggle(btn, open) {
    const panel = document.getElementById(btn.getAttribute('aria-controls'));
    const want = open === undefined ? btn.getAttribute('aria-expanded') !== 'true' : open;
    btn.setAttribute('aria-expanded', String(want)); panel.hidden = !want;
  }

  /* ---------- events ---------- */
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]'); if (!b) return;
    tab = b.dataset.tab; limit = PAGE; drawTabs(); drawSort(); drawActions(); renderList();
  });
  $('sort').addEventListener('change', () => { limit = PAGE; renderAll(); });
  $('more-btn').addEventListener('click', () => { limit += PAGE; renderList(); });
  let qTimer; $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { limit = PAGE; renderAll(); }, 180); });
  $('inelig').addEventListener('change', () => { limit = PAGE; renderAll(); });
  const clearAll = () => { $('q').value = ''; $('inelig').checked = false; Object.keys(asked).forEach(k => delete asked[k]); limit = PAGE; renderAll(); $('q').focus(); };
  $('clear').addEventListener('click', clearAll);

  document.addEventListener('click', async e => {
    const s = e.target.closest('[data-save]'), d = e.target.closest('[data-dismiss]'), u = e.target.closest('#unhide'),
          t = e.target.closest('.opp-toggle'), i = e.target.closest('[data-interest]'), c = e.target.closest('#clear2');
    if (s) {
      const id = s.dataset.save;
      const r = [...F.KINDS.flatMap(k => ranked[k]), ...ranked.saved].find(x => x.item.id === id);
      if (r) { F.toggleSaved(r.item); renderAll(); QIST.toast(QIST.t(F.isSaved(id) ? 'feed.saved' : 'feed.save')); }
    } else if (d) { F.dismiss(d.dataset.dismiss); renderAll(); }
    else if (u) { F.undismissAll(); renderAll(); }
    else if (c) clearAll();
    else if (t) toggle(t);
    else if (i) {
      const it = F.KINDS.flatMap(k => data[k]).find(x => x.id === i.dataset.interest);
      if (!it) return;
      i.disabled = true;
      const res = await QIST.recordInterest(it.opp, { country: view().country, stage: view().stage });
      QIST.toast(QIST.t(res.ok ? 'opp.toast.ok' : 'opp.toast.fail'));
      i.disabled = !!res.ok; if (res.ok) i.textContent = QIST.t('opp.interested.sent');
    }
  });

  renderAll();
  goToHash();
  window.addEventListener('hashchange', goToHash);
  if (!hadProfile && !location.hash) setOpen(true);
})();
</script>
</body>
