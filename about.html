<head>

<meta name="description" content="Who is behind ScienceBridge, where the researcher profiles came from, how to manage your data and how to remove your profile.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-16a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="container">
  <div class="page-top">
    <div><span class="photo-num" style="background-image:url('assets/img/ulugh-beg.jpg');background-position:70% center" aria-hidden="true">QIST</span></div>
    <div><h1 data-i18n="about.h2"></h1><p class="lede" data-i18n="top.qist"></p></div>
  </div>
</div>

<div class="container">

  <article class="prose">
    <p class="intro" data-i18n-html="about.intro"></p>
    <p data-i18n="about.phase"></p>
    <p class="meta" data-i18n="about.stage"></p>

    <h2 id="data" data-i18n="about.data.h"></h2>
    <p data-i18n-html="about.data.p1"></p>
    <p data-i18n-html="about.data.p2"></p>
    <p data-i18n="about.data.p3"></p>
    <div class="actions">
      <a class="btn btn-primary" id="claim-link" href="#" data-i18n="about.claim"></a>
      <a class="btn btn-outline" id="remove-link" href="#" data-i18n="about.remove"></a>
    </div>
    <p class="meta" id="contact-fallback"></p>

    <h2 data-i18n="about.use.h"></h2>
    <ul>
      <li data-i18n="about.use.a"></li>
      <li data-i18n="about.use.b"></li>
      <li data-i18n="about.use.c"></li>
      <li data-i18n="about.use.d"></li>
    </ul>

    <h2 data-i18n="about.else.h"></h2>
    <div class="link-list">
      <a href="newsletter.html">
        <b><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span data-i18n="foot.newsletter"></span></b>
        <span data-i18n="about.else.news"></span>
      </a>
      <a href="channels.html">
        <b><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg><span data-i18n="about.else.disc.h"></span></b>
        <span data-i18n="about.else.disc"></span>
      </a>
    </div>

    <h2 data-i18n="about.contact.h"></h2>
    <p data-i18n="about.contact.p"></p>
    <p class="meta" id="contact-line"></p>
  </article>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-16a"></script>
<script src="assets/js/app.js?v=2026-10-16a"></script>
<script>
(async () => {
  await QIST.boot('about.html');

  // The single address lives in one place: assets/js/app.js -> QIST.CONTACT_EMAIL
  const mail = QIST.CONTACT_EMAIL || '';
  const claim = document.getElementById('claim-link');
  const remove = document.getElementById('remove-link');
  const fallback = document.getElementById('contact-fallback');
  const line = document.getElementById('contact-line');

  if (mail) {
    claim.href  = `mailto:${mail}?subject=${encodeURIComponent('My profile in the ScienceBridge AI directory')}&body=${encodeURIComponent('Hello,\n\nMy name in the directory: \nProfile link: \n\nI would like to manage this profile.')}`;
    remove.href = `mailto:${mail}?subject=${encodeURIComponent('Please remove my profile from the ScienceBridge directory')}&body=${encodeURIComponent('Hello,\n\nMy name in the directory: \nProfile link: \n\nPlease delete my data.')}`;
    line.textContent = mail;
  } else {
    // Honest state: no address configured, so we do not pretend the buttons work.
    [claim, remove].forEach(b => { b.classList.add('btn-outline'); b.classList.remove('btn-primary'); b.setAttribute('aria-disabled','true'); b.href = '#'; b.addEventListener('click', e => e.preventDefault()); });
    fallback.innerHTML = '<b>No contact address is configured yet.</b> Set it in <code>assets/js/app.js</code> → <code>QIST.CONTACT_EMAIL</code> and these buttons will work.';
    line.textContent = '—';
  }
})();
</script>
</body>
</html>
