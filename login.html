<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="login.h">Create your profile · ScienceBridge AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-17a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="auth-wrap">
  <div class="card auth-card">
    <h1 style="font-size:1.6rem;margin-bottom:14px" data-i18n="login.signin.h">Sign in</h1>
    <div id="auth-alert"></div>
    <form id="login-form" onsubmit="return false">
      <div class="form-row"><label for="l-email" data-i18n="common.email">Email</label>
        <input type="email" id="l-email" required style="width:100%" placeholder="you@university.edu"></div>
      <div class="form-row"><label for="l-password" data-i18n="pf.password">Password</label>
        <input type="password" id="l-password" required style="width:100%"></div>
      <button class="btn btn-primary" type="submit" style="width:100%" data-i18n="nav.signin">Sign in</button>
    </form>
    <p class="small muted" style="margin-top:16px" data-i18n="login.invited"></p>
    <p class="small muted" style="margin-top:8px"><span data-i18n="login.new"></span> <a href="join.html" data-i18n="nav.create">Create profile</a></p>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-17a"></script>
<script src="assets/js/app.js?v=2026-10-17a"></script>
<script>
(async () => {
  await QIST.boot('login.html');
  const $ = id => document.getElementById(id);
  const next = new URLSearchParams(location.search).get('next') || 'profile.html';
  // No server yet: there is nothing to sign in to, and the profile form explains what happens instead.
  if (!QIST.authAvailable()) { location.replace('join.html' + location.search); return; }
  document.body.dataset.ready = '1';
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await QIST.login($('l-email').value.trim(), $('l-password').value);
      location.href = /^[\w.\-]+\.html(\?.*)?$/.test(next) ? next : 'profile.html';   // never an off-site address
    } catch (ex) { $('auth-alert').innerHTML = `<div class="alert alert-error">${QIST.esc(ex.message)}</div>`; }
  });
})();
</script>
</body>
</html>
