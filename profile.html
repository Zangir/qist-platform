<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — QIST</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-12a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container" style="max-width:840px">
    <div class="section-head"><h2 class="rule">My profile</h2></div>
    <div class="card" style="margin-bottom:24px" id="me-card"></div>

    <div class="card today-card" style="margin-bottom:24px" id="today-card">
      <h3 data-i18n="feed.today.h">Today for you</h3>
      <div id="today-body" class="small" style="margin-top:10px"></div>
      <p style="margin-top:14px"><a class="btn btn-outline btn-sm" href="feed.html" data-i18n="feed.today.all">Open my full feed</a></p>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3>My collaboration requests</h3>
        <div id="my-requests" class="small" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h3>My posts</h3>
        <div id="my-posts" class="small" style="margin-top:10px"></div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-12a"></script>
<script src="assets/js/app.js?v=2026-10-12a"></script>
<script src="assets/js/feed.js?v=2026-10-12a"></script>
<script>
(async () => {
  await QIST.boot('profile.html');
  const u = QIST.requireRole('member');
  if (!u) return;

  document.getElementById('me-card').innerHTML = `
    <div style="display:flex;gap:16px;align-items:center">
      <div class="avatar" style="width:64px;height:64px;flex:0 0 64px;font-size:1.3rem;background:${QIST.avatarColor(u.name)}">${QIST.initials(u.name)}</div>
      <div>
        <h3 style="margin:0">${QIST.esc(u.name)}</h3>
        <div class="small muted">${QIST.esc(u.email)} · role: <b>${QIST.esc(u.role)}</b></div>
      </div>
    </div>
    <p class="small muted" style="margin-top:14px">Your account is active${u.role === 'admin' ? ' with administrator privileges — open the <a href="admin.html">admin panel</a> to manage the platform' : ''}.
    To appear on the <a href="map.html">researcher map</a> with precise coordinates, ask an admin to set your city.</p>`;

  /* Today for you: the three best matches in each feed, by the same engine as feed.html. */
  try {
    const F = QIST.feed, { data } = await F.load();
    let profile = F.loadProfile();
    const remote = await F.pullRemoteProfile();
    if (remote) profile = F.saveProfile(remote);
    const rows = F.KINDS.map(k => {
      const top = F.rank(data[k].items || [], profile, {}).slice(0, 3);
      return top.map((r, i) => `<div class="t-row"><span class="t-kind">${i === 0 ? QIST.esc(QIST.t('feed.tab.' + k)) : ''}</span>
        <a href="${QIST.esc(r.item.url)}" target="_blank" rel="noopener">${QIST.esc(r.item.title)}</a></div>`).join('');
    }).join('');
    document.getElementById('today-body').innerHTML = (F.hasProfile() ? '' : `<p class="muted">${QIST.t('feed.notice.profile')}</p>`) +
      (rows || `<p class="muted">${QIST.t('feed.none')}</p>`);
  } catch (e) {
    console.error(e);
    document.getElementById('today-body').innerHTML = `<p class="muted">${QIST.t('feed.err')}</p>`;
  }

  const reqs = QIST.overlay('collab_requests').filter(r => r.from === u.email);
  document.getElementById('my-requests').innerHTML = reqs.length
    ? reqs.map(r => `<div style="padding:8px 0;border-bottom:1px solid var(--paper-2)">
        → <b>${QIST.esc(r.toName)}</b> <span class="muted">(${QIST.esc(r.date)})</span><br>
        <span class="muted">topics: ${QIST.esc(r.topics)}</span></div>`).join('')
    : '<p class="muted">No requests yet — try <a href="matching.html">academic matching</a>.</p>';

  const posts = (await QIST.getPosts()).filter(p => p.author === u.name);
  document.getElementById('my-posts').innerHTML = posts.length
    ? posts.map(p => `<div style="padding:8px 0;border-bottom:1px solid var(--paper-2)">
        <b>${QIST.esc(p.title)}</b> <span class="muted">in #${QIST.esc(p.channel)} (${QIST.esc(p.date)})</span></div>`).join('')
    : '<p class="muted">No posts yet — share something on the <a href="channels.html">channels</a>.</p>';
})();
</script>
</body>
</html>
