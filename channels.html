<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="ch.h2">Community discussions · ScienceBridge AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-12a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="container">
  <div class="page-top">
    <div><span class="photo-num" id="top-num" style="background-image:url('assets/img/ulugh-beg.jpg');background-position:65% center" aria-hidden="true">3</span><span class="unit" data-i18n="top.posts"></span></div>
    <div><h1 data-i18n="ch.h2"></h1><p class="lede" data-i18n="about.else.disc"></p></div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="channel-layout">
      <aside>
        <nav class="channel-list" id="channel-list"></nav>
      </aside>
      <main>
        <div class="section-head" style="margin-bottom:14px">
          <div>
            <h2 id="ch-title" style="font-size:1.5rem"></h2>
            <p class="muted small" id="ch-desc"></p>
          </div>
          <button class="btn btn-primary" id="btn-new-post" data-i18n="ch.new"></button>
        </div>
        <div class="filters" style="margin-bottom:18px">
          <input type="text" id="post-q" class="search-input" data-i18n-attr="placeholder:ch.search.ph">
        </div>
        <div id="posts"></div>
        <p id="posts-empty" class="muted" style="display:none;text-align:center;padding:40px 0" data-i18n="ch.empty"></p>
      </main>
    </div>
  </div>
</section>

<div class="modal-overlay" id="post-modal">
  <div class="modal">
    <button class="close" onclick="document.getElementById('post-modal').classList.remove('open')">✕</button>
    <h2 style="margin-bottom:16px" data-i18n="ch.new"></h2>
    <div id="post-alert"></div>
    <form id="post-form">
      <div class="form-row">
        <label>Channel</label>
        <select id="p-channel" style="width:100%"></select>
      </div>
      <div class="form-row">
        <label data-i18n="ch.f.title"></label>
        <input type="text" id="p-title" required style="width:100%" placeholder="e.g. Postdoc in ML at Nazarbayev University">
      </div>
      <div class="form-row">
        <label data-i18n="ch.f.body"></label>
        <textarea id="p-body" rows="5" required placeholder="Description, requirements, how to apply…"></textarea>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label data-i18n="ch.f.link"></label>
          <input type="url" id="p-link" style="width:100%" placeholder="https://…">
        </div>
        <div class="form-row">
          <label>Deadline (optional)</label>
          <input type="text" id="p-deadline" style="width:100%" placeholder="YYYY-MM-DD">
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Publish</button>
    </form>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-12a"></script>
<script src="assets/js/app.js?v=2026-10-12a"></script>
<script>
(async () => {
  await QIST.boot('channels.html');
  const $ = id => document.getElementById(id);
  const channels = QIST.channels();
  /* Old links live on: ?c=jobs, ?c=grants and ?c=collab were bookmarked and shared before
     those channels moved into Opportunities. Landing on one used to throw, because the channel
     no longer exists. Now the page opens the first live channel and says where the old one went,
     instead of failing or pretending the link was never valid. */
  const RETIRED = ['jobs', 'grants', 'collab'];
  const asked = new URLSearchParams(location.search).get('c') || '';
  const cameFromRetired = RETIRED.includes(asked);
  let current = channels.some(c => c.id === asked) ? asked : channels[0].id;

  async function renderSidebar() {
    const all = await QIST.getPosts();
    $('top-num').textContent = all.length;
    $('channel-list').innerHTML = channels.map(c => `
      <a href="?c=${c.id}" data-c="${c.id}" class="${c.id === current ? 'active' : ''}">
        <span class="em">${QIST.icon(c.icon)}</span> ${c.name}
        <span class="count">${all.filter(p => p.channel === c.id).length}</span>
      </a>`).join('');
    document.querySelectorAll('#channel-list a').forEach(a =>
      a.addEventListener('click', e => {
        e.preventDefault();
        current = a.dataset.c;
        history.replaceState(null, '', '?c=' + current);
        renderSidebar(); renderPosts();
      }));
  }

  function badgeFor(c) { return { conferences: 'navy', general: 'teal' }[c] || ''; }

  if (cameFromRetired) {
    document.querySelector('.container').insertAdjacentHTML('afterbegin',
      `<div class="card pad-lg" style="margin-bottom:18px;border-left:4px solid var(--gold);text-align:left">
         <p class="small" style="color:var(--ink-soft);line-height:1.6">${QIST.t('ch.moved')}</p>
         <p style="margin-top:10px"><a class="btn btn-primary" href="opportunities.html">${QIST.t('ch.moved.link')}</a></p>
       </div>`);
  }

  async function renderPosts() {
    const ch = channels.find(c => c.id === current) || channels[0];
    $('ch-title').textContent = ch.name;
    $('ch-desc').textContent = ch.desc;
    const q = $('post-q').value.trim().toLowerCase();
    let posts = await QIST.getPosts(current);
    if (q) posts = posts.filter(p => (p.title + ' ' + p.body).toLowerCase().includes(q));
    $('posts-empty').style.display = posts.length ? 'none' : 'block';
    $('posts').innerHTML = posts.map(p => `
      <div class="post">
        <div class="meta">
          <span class="badge ${badgeFor(p.channel)}">${channels.find(c => c.id === p.channel)?.name || p.channel}</span>
          <span>${QIST.icon('calendar')} ${QIST.esc(p.date || '')}</span>
          <span>${QIST.icon('user')} ${QIST.esc(p.author || 'QIST')}</span>
          ${p.deadline ? `<span class="deadline">${QIST.icon('clock')} ${QIST.t('ch.f.deadline')}: ${QIST.esc(p.deadline)}</span>` : ''}
        </div>
        <h3>${QIST.esc(p.title)}</h3>
        <div class="body">${QIST.esc(p.body || '')}</div>
        ${p.link ? `<p style="margin-top:10px"><a class="btn btn-outline btn-sm" href="${QIST.esc(p.link)}" target="_blank" rel="noopener">${QIST.t('ch.openlink')} ${QIST.icon('external')}</a></p>` : ''}
      </div>`).join('');
  }

  $('p-channel').innerHTML = channels.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

  $('btn-new-post').addEventListener('click', () => {
    if (!QIST.currentUser()) {
      QIST.toast('Please sign in to post.');
      setTimeout(() => location.href = 'login.html?next=channels.html', 900);
      return;
    }
    $('p-channel').value = current;
    $('post-modal').classList.add('open');
  });

  $('post-form').addEventListener('submit', async e => {
    e.preventDefault();
    const postedChannel = $('p-channel').value;
    await QIST.addPost({
      channel: postedChannel,
      title: $('p-title').value.trim(),
      body: $('p-body').value.trim(),
      link: $('p-link').value.trim(),
      deadline: $('p-deadline').value.trim()
    });
    $('post-modal').classList.remove('open');
    $('post-form').reset();
    QIST.toast('Post published.');
    current = postedChannel || current;
    history.replaceState(null, '', '?c=' + current);
    renderSidebar(); renderPosts();
  });

  $('post-q').addEventListener('input', renderPosts);
  await renderSidebar();
  await renderPosts();
})();
</script>
</body>
</html>
