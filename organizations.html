<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="org.title">For organizations · ScienceBridge AI</title>
<meta name="description" content="Universities and companies: post an R&D need or a vacancy, find researchers by field and country, or book a 30-minute conversation with the QIST team.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-17a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<!-- ================= hero + audience switch =================
     One page, two readings (D-28). The switch rewrites the headline and the section ledes. -->
<section class="org-hero">
  <div class="container org-hero-grid">
   <div>
    <div class="org-switch" role="tablist" data-i18n-attr="aria-label:org.title">
      <button id="as-company" role="tab" aria-selected="true" data-i18n="org.tab.company"></button>
      <button id="as-university" role="tab" aria-selected="false" data-i18n="org.tab.university"></button>
    </div>
    <h1 id="org-h1"></h1>
    <p id="org-sub" class="org-sub"></p>
    <div class="org-jump">
      <a class="btn btn-gold" href="#post" data-i18n="org.jump.post"></a>
      <a class="btn btn-ghost" href="#find" data-i18n="org.jump.find"></a>
      <a class="btn btn-ghost" href="#talk" data-i18n="org.jump.talk"></a>
    </div>
   </div>
   <div class="org-num"><span class="photo-num" id="top-num" style="background-image:url('assets/img/meeting-almaty.jpg');background-position:60% 40%" aria-hidden="true">0</span><span class="unit" data-i18n="top.people"></span></div>
  </div>
</section>

<div class="container">

  <!-- ================= what expertise is in the network =================
       First on the page: it answers "is anyone there?" before asking anyone to fill in a form. -->
  <section id="find" class="org-block">
    <div class="sec-head">
      <h2 data-i18n="org.find.h2"></h2>
      <p class="lede" id="find-lede"></p>
    </div>
    <div class="find-filters" id="find-filters">
      <input type="text" id="fd-q" class="search-input" data-i18n-attr="placeholder:org.find.ph;aria-label:org.find.ph">
      <select id="fd-field" data-i18n-attr="aria-label:common.allfields"></select>
      <select id="fd-country" data-i18n-attr="aria-label:common.allcountries"></select>
    </div>
    <p class="count-line" id="find-count" data-i18n="common.loading"></p>
    <div class="rows" id="find-list"></div>
    <div class="more"><button class="btn btn-outline" id="find-more" hidden data-i18n="common.showmore"></button></div>
  </section>

  <!-- ================= post a need ================= -->
  <section id="post" class="org-block split">
    <div class="split-intro">
      <h2 data-i18n="org.post.h2"></h2>
      <p id="post-lede"></p>
      <p class="note" data-i18n="org.post.note"></p>
    </div>
    <form class="panel form" id="need-form">
      <div class="row-2">
        <label><span data-i18n="org.f.what"></span>
          <select id="n-type">
            <option value="rnd_challenge" data-i18n="org.f.rnd"></option>
            <option value="academic_job" data-i18n="org.f.acad"></option>
            <option value="industry_job" data-i18n="org.f.ind"></option>
            <option value="consortium_role" data-i18n="org.f.cons"></option>
            <option value="expert_request" data-i18n="org.f.expert"></option>
          </select>
        </label>
        <label><span data-i18n="org.f.deadline"></span>
          <input type="date" id="n-deadline">
        </label>
      </div>
      <label><span data-i18n="org.f.title"></span>
        <input type="text" id="n-title" required data-i18n-attr="placeholder:org.f.title.ph">
      </label>
      <label><span data-i18n="org.f.summary"></span>
        <textarea id="n-summary" rows="5" required data-i18n-attr="placeholder:org.f.summary.ph"></textarea>
      </label>
      <div class="row-2">
        <label><span data-i18n="org.f.field"></span><select id="n-field"></select></label>
        <label><span data-i18n="org.f.who"></span><select id="n-stage"></select></label>
      </div>
      <div class="row-2">
        <label><span data-i18n="common.country"></span><select id="n-country"></select></label>
        <label><span data-i18n="org.f.funding"></span>
          <select id="n-funding">
            <option value="confirmed" data-i18n="org.f.funding.yes"></option>
            <option value="cofunding_required" data-i18n="org.f.funding.part"></option>
            <option value="not_confirmed" data-i18n="org.f.funding.no"></option>
          </select>
        </label>
      </div>
      <div class="row-2">
        <label><span data-i18n="common.org"></span>
          <input type="text" id="n-org" required data-i18n-attr="placeholder:org.f.orgname.ph">
        </label>
        <label><span data-i18n="org.f.you"></span>
          <input type="text" id="n-name" required data-i18n-attr="placeholder:org.f.you.ph">
        </label>
      </div>
      <label><span data-i18n="org.f.replyto"></span>
        <input type="email" id="n-email" required placeholder="you@university.edu">
      </label>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="need-send" data-i18n="org.post.send"></button>
        <span class="state" id="need-state" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <!-- ================= book a conversation ================= -->
  <section id="talk" class="org-block split">
    <div class="split-intro">
      <h2 data-i18n="org.talk.h2"></h2>
      <p id="talk-lede"></p>
      <p class="note" data-i18n="org.talk.note"></p>
    </div>
    <form class="panel form" id="talk-form">
      <div class="row-2">
        <label><span data-i18n="common.org"></span>
          <input type="text" id="t-org" required placeholder="Al-Farabi Kazakh National University">
        </label>
        <label><span data-i18n="org.f.you"></span>
          <input type="text" id="t-name" required placeholder="Aigerim Bekova, vice-rector for research">
        </label>
      </div>
      <div class="row-2">
        <label><span data-i18n="common.email"></span>
          <input type="email" id="t-email" required placeholder="you@university.edu">
        </label>
        <label><span data-i18n="common.country"></span><select id="t-country"></select></label>
      </div>
      <label><span data-i18n="org.talk.goal"></span>
        <textarea id="t-goal" rows="3" data-i18n-attr="placeholder:org.talk.goal.ph"></textarea>
      </label>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="talk-send" data-i18n="org.talk.send"></button>
        <span class="state" id="talk-state" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <!-- ================= current status ================= -->
  <section class="org-block">
    <div class="sec-head"><h2 data-i18n="org.honest.h2"></h2></div>
    <div class="status">
      <div class="ok">
        <h3 data-i18n="org.honest.ok.h"></h3>
        <ul>
          <li id="honest-a"></li>
          <li id="honest-b"></li>
          <li data-i18n="org.honest.ok.c"></li>
          <li data-i18n="org.honest.ok.d"></li>
        </ul>
      </div>
      <div class="gap">
        <h3 data-i18n="org.honest.gap.h"></h3>
        <ul>
          <li data-i18n="org.honest.gap.a"></li>
          <li data-i18n="org.honest.gap.b"></li>
          <li data-i18n="org.honest.gap.c"></li>
          <li data-i18n="org.honest.gap.d"></li>
          <li data-i18n="org.honest.gap.e"></li>
        </ul>
      </div>
    </div>
  </section>

</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-17a"></script>
<script src="assets/js/app.js?v=2026-10-17a"></script>
<script>
(async () => {
  await QIST.boot('organizations.html');
  const $ = id => document.getElementById(id);

  /* Deploy guard, same contract as the other pages: name the stale file instead of
     rendering a half-broken screen. */
  if (typeof QIST.submitOrgRequest !== 'function' || !QIST.PRIMARY_FIELDS) {
    $('find-count').innerHTML =
      '<b>assets/js/app.js is older than this page.</b> Upload the whole release together — this page expects build 2026-10-17a.';
    return;
  }

  let people = [], opps = [], elig = null;
  try {
    [people, opps, elig] = await Promise.all([QIST.getPeople(), QIST.getOpportunities(), QIST.getEligibility()]);
    people = QIST.uniquePeople(people);
    $('top-num').textContent = people.length;
  } catch (_) {
    $('find-count').textContent = 'Could not load the directory. Check your connection and reload.';
  }

  /* ---------- audience switch ----------
     One page, two readings. There is no evidence yet that universities and companies need
     separate pages — the survey had four industry respondents — so the split is a switch,
     not two URLs. See DECISIONS.md D-28. */
  const COPY = {
    university: { h1: 'org.h1.university', sub: 'org.sub.university', post: 'org.post.lede.university', talk: 'org.talk.lede.university' },
    company:    { h1: 'org.h1.company',    sub: 'org.sub.company',    post: 'org.post.lede.company',    talk: 'org.talk.lede.company' }
  };

  function setAudience(who, push) {
    const c = COPY[who] || COPY.company;
    $('org-h1').textContent = QIST.t(c.h1);
    $('org-sub').textContent = QIST.t(c.sub);
    $('post-lede').textContent = QIST.t(c.post);
    $('talk-lede').textContent = QIST.t(c.talk);
    $('as-university').setAttribute('aria-selected', who === 'university');
    $('as-company').setAttribute('aria-selected', who === 'company');
    audience = who;
    if (push) {
      const p = new URLSearchParams(location.search);
      p.set('as', who);
      history.replaceState(null, '', '?' + p + location.hash);
    }
  }
  // Company first: the switch order follows the page, and the page opens on company.
  let audience = 'company';
  setAudience(new URLSearchParams(location.search).get('as') === 'university' ? 'university' : 'company', false);
  $('as-university').addEventListener('click', () => setAudience('university', true));
  $('as-company').addEventListener('click', () => setAudience('company', true));

  /* ---------- shared lookups ---------- */
  QIST.PRIMARY_FIELDS.forEach(f =>
    $('n-field').insertAdjacentHTML('beforeend', `<option value="${QIST.esc(f)}">${QIST.esc(f)}</option>`));
  Object.entries(elig ? elig.career_stages : {}).forEach(([k, v]) =>
    $('n-stage').insertAdjacentHTML('beforeend', `<option value="${k}">${QIST.esc(v)}</option>`));
  if (elig) {
    QIST.fillCountrySelect($('n-country'), elig, 'KZ');
    QIST.fillCountrySelect($('t-country'), elig, 'KZ');
  }

  /* ---------- 2. find researchers ----------
     A real search over the same directory data, not a mock-up. Counts next to each field are
     the number of people behind it, so an empty area of the map is visible rather than hidden. */
  const countryLabel = name => name; // people.json stores country names, not ISO codes
  const counts = QIST.fieldCounts(people);
  $('fd-field').insertAdjacentHTML('beforeend', `<option value="">${QIST.t('common.allfields')}</option>`);
  QIST.PRIMARY_FIELDS.forEach(f => {
    const n = counts[f] || 0;
    $('fd-field').insertAdjacentHTML('beforeend',
      `<option value="${QIST.esc(f)}"${n ? '' : ' disabled'}>${QIST.esc(f)}${n ? ` (${n})` : ' —'}</option>`);
  });

  const countryNames = [...new Set(people.map(p => p.country).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  $('fd-country').insertAdjacentHTML('beforeend', `<option value="">${QIST.t('common.allcountries')}</option>`);
  countryNames.forEach(c => {
    const n = people.filter(p => p.country === c).length;
    $('fd-country').insertAdjacentHTML('beforeend', `<option value="${QIST.esc(c)}">${QIST.esc(c)} (${n})</option>`);
  });

  $('find-lede').innerHTML = QIST.t('org.find.lede', { n: `<b>${people.length}</b>` });
  $('honest-a').innerHTML = QIST.t('org.honest.ok.a', { n: `<b>${people.length}</b>` });
  // the honest number is what is still open, not everything ever added
  $('honest-b').innerHTML = QIST.t('org.honest.ok.b', { n: `<b>${opps.filter(o => !QIST.isExpired(o)).length}</b>` });

  const PAGE = 12;
  let shown = PAGE, matches = [];

  function searchPeople() {
    const q = $('fd-q').value.trim().toLowerCase();
    const field = $('fd-field').value, country = $('fd-country').value;
    matches = people.filter(p => {
      if (country && p.country !== country) return false;
      if (field && !QIST.primaryFields(p).includes(field)) return false;
      // Search only over what this view shows. Searching names here would leak them back:
      // type a name, get one card, and the anonymity is gone.
      if (q) {
        const hay = QIST.primaryFields(p).concat(p.topics || []).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    shown = PAGE;
    drawPeople();
  }

  /* Anonymous capability card.
     The directory is the only asset QIST has. A named, linked, searchable list handed to any
     visitor is an asset given away: an organisation reads it once, finds those people on
     LinkedIn and never comes back. So this view shows what a person can do — field, seniority
     band, country — and never who they are. Name, title, organisation, city and public link
     are not rendered and are not in the DOM. They appear after the person agrees to an
     introduction, which is the moment QIST is actually useful. See DECISIONS.md D-34. */
  function seniority(p) {
    const y = Number(p.experience);
    if (!Number.isFinite(y) || y <= 0) return QIST.t('org.sen.unknown');
    if (y < 5)  return QIST.t('org.sen.early');
    if (y < 10) return QIST.t('org.sen.5');
    if (y < 20) return QIST.t('org.sen.10');
    return QIST.t('org.sen.20');
  }

  function anonCard(p) {
    const fields = QIST.primaryFields(p).slice(0, 2);
    const topics = (p.topics || []).slice(0, 4);
    return `<div class="anon" data-id="${QIST.esc(p.id)}">
      <span class="anon-mask" aria-hidden="true"></span>
      <div>
        <h3>${QIST.esc(fields[0] || QIST.t('org.anon.role'))}</h3>
        <p class="anon-meta">${QIST.esc(seniority(p))}${p.country ? ' · ' + QIST.esc(countryLabel(p.country)) : ''}</p>
      </div>
      <div class="tags">${topics.map(t => `<span class="tag">${QIST.esc(t)}</span>`).join('')}</div>
      <div class="anon-act"><button class="btn btn-outline btn-sm" data-intro="${QIST.esc(p.id)}">${QIST.t('org.anon.intro')}</button></div>
    </div>`;
  }

  function drawPeople() {
    $('find-count').innerHTML = matches.length
      ? QIST.t('org.find.count', { shown: `<b>${matches.length}</b>`, total: people.length })
      : QIST.t('org.find.empty');
    $('find-list').innerHTML = matches.slice(0, shown).map(anonCard).join('');
    $('find-more').hidden = matches.length <= shown;
  }

  ['fd-field', 'fd-country'].forEach(id => $(id).addEventListener('change', searchPeople));
  $('fd-q').addEventListener('input', searchPeople);
  $('find-more').addEventListener('click', () => { shown += PAGE; drawPeople(); });
  searchPeople();

  /* Introduction request. We never hand over an address here: the request goes to QIST and
     QIST asks the researcher. The card says exactly that before anything is sent, and the
     email field opens inline — a browser dialog would hide the sentence that matters. */
  $('find-list').addEventListener('click', async (e) => {
    const open = e.target.closest('[data-intro]');
    if (open) {
      const p = people.find(x => x.id === open.dataset.intro);
      const rowEl = open.closest('.anon');
      open.hidden = true;
      rowEl.insertAdjacentHTML('beforeend', `<div class="anon-intro">
        <p>${QIST.t('org.anon.consent')}</p>
        <div class="row">
          <input type="email" data-intro-email="${QIST.esc(p.id)}" placeholder="${QIST.esc(QIST.t('org.anon.youremail'))}" aria-label="${QIST.esc(QIST.t('org.anon.youremail'))}">
          <button class="btn btn-primary btn-sm" data-intro-send="${QIST.esc(p.id)}">${QIST.t('org.anon.send')}</button>
        </div>
        <span class="state" data-intro-state="${QIST.esc(p.id)}" aria-live="polite"></span>
      </div>`);
      rowEl.querySelector('[data-intro-email]').focus();
      return;
    }

    const send = e.target.closest('[data-intro-send]');
    if (!send) return;
    const id = send.dataset.introSend;
    const p = people.find(x => x.id === id);
    const input = $('find-list').querySelector(`[data-intro-email="${CSS.escape(id)}"]`);
    const state = $('find-list').querySelector(`[data-intro-state="${CSS.escape(id)}"]`);
    const from = (input.value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(from)) { state.textContent = QIST.t('org.anon.bademail'); input.focus(); return; }
    send.disabled = true; send.textContent = QIST.t('common.sending');
    const res = await QIST.submitOrgRequest('org_introduction', 'Introduction request: ' + p.name, {
      researcher_id: p.id, researcher_name: p.name,
      researcher_org: p.institution || '', from_email: from
    });
    if (res.ok) {
      send.textContent = QIST.t('common.sent'); input.disabled = true;
      state.textContent = QIST.t('org.anon.ok');
    } else {
      send.disabled = false; send.textContent = QIST.t('org.anon.send');
      state.textContent = explain(res.reason);
    }
  });

  /* ---------- forms ---------- */
  function explain(reason) {
    if (reason === 'not_configured') return QIST.t('org.state.noendpoint');
    return QIST.t('org.state.fail', { email: QIST.CONTACT_EMAIL || 'QIST' });
  }

  async function handle(formId, btnId, stateId, kind, subject, collect) {
    $(formId).addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $(btnId), state = $(stateId);
      btn.disabled = true; const label = btn.textContent; btn.textContent = QIST.t('common.sending');
      const res = await QIST.submitOrgRequest(kind, subject(), { audience, ...collect() });
      if (res.ok) {
        btn.textContent = QIST.t('common.sent');
        state.textContent = QIST.t('org.state.reply', { email: QIST.CONTACT_EMAIL || 'QIST' });
        $(formId).reset();
        setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 2500);
      } else {
        btn.disabled = false; btn.textContent = label;
        state.textContent = explain(res.reason);
        QIST.toast(explain(res.reason));
      }
    });
  }

  handle('need-form', 'need-send', 'need-state', 'org_need',
    () => 'Posted need: ' + $('n-title').value.trim(),
    () => ({
      need_type: $('n-type').value, title: $('n-title').value.trim(),
      summary: $('n-summary').value.trim(), field: $('n-field').value,
      career_stage: $('n-stage').value, country: $('n-country').value,
      funding_status: $('n-funding').value, deadline: $('n-deadline').value,
      organization: $('n-org').value.trim(), contact_name: $('n-name').value.trim(),
      contact_email: $('n-email').value.trim()
    }));

  handle('talk-form', 'talk-send', 'talk-state', 'org_conversation',
    () => 'Conversation request: ' + $('t-org').value.trim(),
    () => ({
      organization: $('t-org').value.trim(), contact_name: $('t-name').value.trim(),
      contact_email: $('t-email').value.trim(), country: $('t-country').value,
      goal: $('t-goal').value.trim()
    }));
})();
</script>
</body>
</html>
