<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="map.h2">Researchers worldwide · ScienceBridge AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-16a">
<style>
  .marker-cluster-custom { background: none; border: none; }
  .map-name-label {
    background: none; border: none; box-shadow: none;
    font: 600 12px "Onest", sans-serif; color: #f2efe8;
    text-shadow: 0 0 3px #07080b, 0 0 6px #07080b;
  }
  .map-name-label::before { display: none; }
</style>
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="map-page">
  <div class="map-panel">
    <h2 data-i18n="map.h2"></h2>
    <div class="view-switch" style="margin-bottom:12px">
      <a href="directory.html" data-i18n="dir.view.list"></a>
      <a href="map.html" class="active" data-i18n="dir.view.map"></a>
    </div>

    <p class="small muted" id="map-count" style="margin-bottom:12px" data-i18n="common.loading"></p>
    <div class="form-row">
      <input type="text" id="map-search" class="search-input" style="width:100%" data-i18n-attr="placeholder:map.search.ph">
    </div>
    <div class="form-row">
      <select id="map-country" style="width:100%" data-i18n-attr="aria-label:common.allcountries"><option value="" data-i18n="common.allcountries"></option></select>
    </div>
    <div class="form-row">
      <select id="map-topic" style="width:100%" data-i18n-attr="aria-label:common.allfields"><option value="" data-i18n="common.allfields"></option></select>
    </div>
    <div id="map-list" class="small"></div>
  </div>
  <div id="map"></div>
</div>

<script src="assets/js/i18n.js?v=2026-10-16a"></script>
<script src="assets/js/app.js?v=2026-10-16a"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(async () => {
  await QIST.boot('map.html');
  const people = QIST.uniquePeople(await QIST.getPeople());

  const map = L.map('map', { worldCopyJump: true, zoomControl: false }).setView([38, 40], 3);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
    maxZoom: 16
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16
  }).addTo(map);

  const markers = new Map();   // person id -> marker, for ?person=
  const cluster = L.markerClusterGroup({
    maxClusterRadius: 42,
    iconCreateFunction: c => L.divIcon({
      html: `<div class="city-count-badge">${c.getChildCount()}</div>`,
      className: 'marker-cluster-custom', iconSize: [34, 34]
    })
  });
  map.addLayer(cluster);

  const pin = L.divIcon({
    html: `<div style="width:14px;height:14px;border-radius:50%;background:#f5b642;border:2.5px solid #07080b;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`,
    className: '', iconSize: [16, 16], iconAnchor: [8, 8]
  });

  const countrySel = document.getElementById('map-country');
  const topicSel = document.getElementById('map-topic');
  [...new Set(people.map(p => p.country))].filter(Boolean).sort().forEach(c =>
    countrySel.insertAdjacentHTML('beforeend', `<option>${QIST.esc(c)}</option>`));
  // QIST primary research fields — the canonical list lives in app.js
  const fieldCounts = QIST.fieldCounts(people);
  QIST.PRIMARY_FIELDS.forEach(f => {
    const n = fieldCounts[f] || 0;
    topicSel.insertAdjacentHTML('beforeend',
      `<option value="${QIST.esc(f)}"${n ? '' : ' disabled'}>${QIST.esc(f)}${n ? ` (${n})` : ' —'}</option>`);
  });

  function popupHtml(p) {
    return `<div class="map-pop">
      ${QIST.avatarHtml(p)}
      <div>
        <b>${QIST.esc(p.name)}</b>
        <div class="small">${QIST.esc(p.title || '')}<br>${QIST.esc(p.institution || '')}<br>
        ${(p.city || p.country) ? `${QIST.icon(QIST.hasPreciseGeo(p) ? 'pin' : 'globe')} ${QIST.esc([p.city, p.country].filter(Boolean).join(', '))}<br>` : ''}
        <span class="muted">${(p.topics || []).slice(0, 3).map(QIST.esc).join(' · ')}</span><br>
        <a href="directory.html?person=${encodeURIComponent(p.id)}">${QIST.t('map.pop.profile')} →</a></div>
      </div>
    </div>`;
  }

  function apply() {
    const q = document.getElementById('map-search').value.trim().toLowerCase();
    const co = countrySel.value, to = topicSel.value;
    const shown = people.filter(p => {
      if (co && p.country !== co) return false;
      if (to && !QIST.primaryFields(p).includes(to)) return false;
      if (q) {
        const hay = `${p.name} ${p.title} ${p.institution} ${p.city} ${p.country} ${(p.topics || []).join(' ')}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return !!(p.lat && p.lng);
    });

    cluster.clearLayers();
    markers.clear();

    /* Only some records carry precise coordinates. For the rest the source data holds a
       country centroid with no city and no organisation. Scattering them with random jitter
       around that centroid would display an invented address, so they collapse into one
       country marker that says exactly what it is. */
    const precise = shown.filter(p => QIST.hasPreciseGeo(p));
    const vague   = shown.filter(p => !QIST.hasPreciseGeo(p));

    precise.forEach(p => {
      const jitter = () => (Math.random() - 0.5) * 0.015; // separate pins within one city
      const m = L.marker([p.lat + jitter(), p.lng + jitter()], { icon: pin });
      m.bindPopup(popupHtml(p), { maxWidth: 320 });
      /* Names on hover only. As permanent labels they piled onto each other and onto the
         cluster badges wherever two cities sit close together. */
      m.bindTooltip(p.name, { direction: 'right', offset: [9, 0], className: 'map-name-label' });
      markers.set(String(p.id), m);
      cluster.addLayer(m);
    });

    const byCountry = {};
    vague.forEach(p => { (byCountry[p.country] = byCountry[p.country] || []).push(p); });
    Object.entries(byCountry).forEach(([country, group]) => {
      const icon = L.divIcon({
        html: `<div class="country-badge">${group.length}</div>`,
        className: '', iconSize: [38, 38], iconAnchor: [19, 19]
      });
      const m = L.marker([group[0].lat, group[0].lng], { icon });
      m.bindPopup(`<div style="min-width:220px">
        <b>${QIST.esc(country)}</b>
        <div class="small muted" style="margin:4px 0 8px">${QIST.t('map.country.n', { n: group.length })}</div>
        <div class="small">${group.slice(0, 8).map(x => QIST.esc(x.name)).join('<br>')}${
          group.length > 8 ? `<br><span class="muted">${QIST.t('map.more', { n: group.length - 8 })}</span>` : ''}</div>
        <div class="small muted" style="margin-top:8px">${QIST.t('map.country.note')}</div>
      </div>`, { maxWidth: 320 });
      group.forEach(x => markers.set(String(x.id), m));
      cluster.addLayer(m);
    });

    const nPrecise = shown.filter(p => QIST.hasPreciseGeo(p)).length;
    document.getElementById('map-count').innerHTML =
      QIST.t('map.count', { n: shown.length, countries: new Set(shown.map(p => p.country)).size }) +
      `<br><span style="color:var(--ink-faint)">${QIST.t('map.precise', { n: nPrecise })}</span>`;
    document.getElementById('map-list').innerHTML = shown.slice(0, 30).map(p =>
      `<div class="map-list-item" role="button" tabindex="0" data-lat="${p.lat}" data-lng="${p.lng}">
        <b>${QIST.esc(p.name)}</b>${QIST.esc([p.institution, p.city].filter(Boolean).join(' · '))}
      </div>`).join('') + (shown.length > 30 ? `<p class="muted" style="padding-top:8px">${QIST.t('map.more', { n: shown.length - 30 })}</p>` : '');
    document.querySelectorAll('#map-list [data-lat]').forEach(el =>
      el.addEventListener('click', () => map.flyTo([+el.dataset.lat, +el.dataset.lng], 10)));
  }

  ['map-search', 'map-country', 'map-topic'].forEach(id =>
    document.getElementById(id).addEventListener('input', apply));
  apply();

  /* map.html?person=<id>, from "Show on map" in the directory: fly to that person and open
     their popup (or their country marker when the record has no city). */
  const want = new URLSearchParams(location.search).get('person');
  const target = want && markers.get(want);
  if (target) cluster.zoomToShowLayer(target, () => target.openPopup());
})();
</script>
</body>
</html>
