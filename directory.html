<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="dir.h2">Researchers · ScienceBridge AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-10-17a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="container">
  <div class="page-top">
    <div><span class="photo-num" id="top-num" style="background-image:url('assets/img/lab-astana.jpg');background-position:center 40%" aria-hidden="true">0</span><span class="unit" data-i18n="top.people"></span></div>
    <div>
      <h1 data-i18n="dir.h2"></h1>
      <p class="lede" data-i18n="dir.lede"></p>
      <div class="view-switch">
        <a href="directory.html" class="active" aria-current="page" data-i18n="dir.view.list"></a>
        <a href="map.html" data-i18n="dir.view.map"></a>
      </div>
    </div>
  </div>
</div>

<div class="container">
    <div class="dir-filters">
      <span class="search-wrap"><input type="text" id="f-q" class="search-input" data-slash aria-keyshortcuts="/" data-i18n-attr="placeholder:dir.search.ph;aria-label:dir.search.ph"><kbd aria-hidden="true">/</kbd></span>
      <select id="f-field" data-i18n-attr="aria-label:common.allfields"><option value="" data-i18n="common.allfields"></option></select>
      <select id="f-country" data-i18n-attr="aria-label:common.allcountries"><option value="" data-i18n="common.allcountries"></option></select>
      <select id="f-stage" data-i18n-attr="aria-label:dir.stage.all">
        <option value="" data-i18n="dir.stage.all"></option>
        <option value="professor" data-i18n="dir.stage.professor"></option>
        <option value="associate" data-i18n="dir.stage.associate"></option>
        <option value="assistant" data-i18n="dir.stage.assistant"></option>
        <option value="postdoc" data-i18n="dir.stage.postdoc"></option>
        <option value="phd" data-i18n="dir.stage.phd"></option>
        <option value="researcher" data-i18n="dir.stage.researcher"></option>
        <option value="industry" data-i18n="dir.stage.industry"></option>
      </select>
      <select id="f-exp" data-i18n-attr="aria-label:dir.exp.all">
        <option value="" data-i18n="dir.exp.all"></option>
        <option value="0-5" data-i18n="dir.exp.0"></option>
        <option value="5-10" data-i18n="dir.exp.5"></option>
        <option value="10-99" data-i18n="dir.exp.10"></option>
      </select>
      <button class="btn btn-quiet btn-sm" id="f-clear" data-i18n="common.clear"></button>
    </div>

    <p class="count-line" id="dir-count" data-i18n="common.loading"></p>
    <div id="dir-grid" class="rows"></div>
    <div class="more"><button class="btn btn-outline" id="dir-more" hidden></button></div>
    <div id="dir-empty" class="empty" hidden>
      <p data-i18n="dir.empty"></p>
      <button class="btn btn-outline btn-sm" id="dir-reset" data-i18n="common.clear"></button>
    </div>
</div>

<div class="modal-overlay" id="person-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="person-name">
    <button class="close" type="button" data-close data-i18n-attr="aria-label:common.close">✕</button>
    <div id="person-detail"></div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-10-17a"></script>
<script src="assets/js/app.js?v=2026-10-17a"></script>
<script>
(async () => {
  await QIST.boot('directory.html');
  const people = QIST.uniquePeople(await QIST.getPeople());
  const $ = id => document.getElementById(id);
  $('top-num').textContent = people.length;
  const PAGE = 24;
  let limit = PAGE;

  /* Filters use the same 35 QIST research fields as the map, the home page and the
     organizations page. The old list was every free-text topic used three times or more,
     labelled "Research field", so the same word meant two different things on two pages. */
  const fieldCounts = QIST.fieldCounts(people);
  QIST.PRIMARY_FIELDS.forEach(f => {
    const n = fieldCounts[f] || 0;
    if (n) $('f-field').insertAdjacentHTML('beforeend', `<option value="${QIST.esc(f)}">${QIST.esc(f)} (${n})</option>`);
  });
  [...new Set(people.map(p => p.country))].filter(Boolean).sort().forEach(c =>
    $('f-country').insertAdjacentHTML('beforeend', `<option>${QIST.esc(c)}</option>`));

  /* Career stage is read from the free-text title; the records carry no stage field. */
  function stage(p) {
    const t = (p.title || '').toLowerCase();
    if (t.includes('assistant professor')) return 'assistant';
    if (t.includes('associate professor')) return 'associate';
    if (t.includes('professor') || t.includes('dean') || t.includes('rector')) return 'professor';
    if (t.includes('postdoc')) return 'postdoc';
    if (t.includes('phd')) return 'phd';
    if (t.includes('scientist') || t.includes('engineer') || t.includes('lead') || t.includes('founder')) return 'industry';
    return 'researcher';
  }
  const stageLabel = p => QIST.t('dir.stage.' + stage(p));

  /* ---------- search ----------
     Used to keep anyone whose record contained any word of the query, in file order, so a
     problem described in a sentence ("corrosion in oil pipelines") matched half the network
     with the best people buried on page nine. Now every record is scored: a word in the
     topics counts most, then the title, then organisation and bio; people matching more of
     the words come first. When enough people match at least half of the words, the rest are
     dropped. Words match from the start ("oil" finds "oil & gas", not "soil"), and plurals
     are trimmed so "pipelines" finds "pipeline". */
  const STOP = new Set(['the', 'and', 'for', 'with', 'from', 'into', 'your', 'that', 'this', 'want', 'need', 'solve', 'our', 'are', 'who', 'can', 'problem', 'research']);
  const stem = w => w.length > 4 ? w.replace(/(ies|es|s|ing|ed)$/, '') : w;
  function terms(q) {
    return [...new Set(q.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 2 && !STOP.has(w)).map(stem))];
  }
  const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function score(p, ts, phrase) {
    const topics = (p.topics || []).join(' ').toLowerCase();
    const title = `${p.name} ${p.title || ''}`.toLowerCase();
    const rest = `${p.institution || ''} ${p.city || ''} ${p.country || ''} ${p.bio || ''} ${QIST.primaryFields(p).join(' ')}`.toLowerCase();
    let hits = 0, weight = 0;
    ts.forEach(t => {
      const re = new RegExp('(^|[^\\p{L}\\p{N}])' + escRe(t), 'u');
      const w = (re.test(topics) ? 3 : 0) + (re.test(title) ? 2 : 0) + (re.test(rest) ? 1 : 0);
      if (w) { hits++; weight += w; }
    });
    if (phrase && `${title} ${topics} ${rest}`.includes(phrase)) { hits = Math.max(hits, ts.length); weight += 6; }
    return { hits, weight };
  }

  /* ---------- state lives in the URL, like the opportunities page ---------- */
  const IDS = { q: 'f-q', field: 'f-field', country: 'f-country', stage: 'f-stage', exp: 'f-exp' };
  function readUrl() {
    const u = new URLSearchParams(location.search);
    Object.entries(IDS).forEach(([k, id]) => { if (u.has(k)) $(id).value = u.get(k); });
  }
  const initial = new URLSearchParams(location.search);
  function writeUrl(person) {
    const u = new URLSearchParams();
    if (initial.get('lang')) u.set('lang', initial.get('lang'));
    Object.entries(IDS).forEach(([k, id]) => { if ($(id).value) u.set(k, $(id).value); });
    if (person) u.set('person', person);
    history.replaceState(null, '', u.toString() ? '?' + u : location.pathname);
  }

  function filtered() {
    const q = $('f-q').value.trim().toLowerCase();
    const field = $('f-field').value, co = $('f-country').value, st = $('f-stage').value, ex = $('f-exp').value;
    let list = people.filter(p => {
      if (field && !QIST.primaryFields(p).includes(field)) return false;
      if (co && p.country !== co) return false;
      if (st && stage(p) !== st) return false;
      if (ex) {
        const [lo, hi] = ex.split('-').map(Number);
        const e = p.experience ?? -1;
        if (e < lo || e >= hi) return false;
      }
      return true;
    });
    const ts = terms(q);
    if (!q) return list;
    if (!ts.length) return list.filter(p => `${p.name} ${(p.topics || []).join(' ')}`.toLowerCase().includes(q));
    const scored = list.map(p => ({ p, ...score(p, ts, q) })).filter(x => x.hits)
      .sort((a, b) => b.hits - a.hits || b.weight - a.weight);
    const strong = scored.filter(x => x.hits >= Math.ceil(ts.length / 2));
    return (strong.length >= 6 ? strong : scored).map(x => x.p);
  }

  /* One person per row: who (name, title), where (organisation, place), what (topics).
     Replaced a grid of 250px cards that showed nine people per screen. */
  function card(p) {
    const e = p.experience ? ` · ${QIST.t('dir.exp.years', { n: p.experience })}` : '';
    const geo = (p.city || p.country)
      ? `<span class="loc">${QIST.icon(QIST.hasPreciseGeo(p) ? 'pin' : 'globe')} ${QIST.esc(QIST.geoLabel(p))}</span>` : '';
    const topics = (p.topics || []).slice(0, 4);
    return `<div class="person" role="button" tabindex="0" data-id="${QIST.esc(p.id)}" aria-label="${QIST.esc(p.name)}">
      ${QIST.avatarHtml(p)}
      <div>
        <h3>${QIST.esc(p.name)}</h3>
        <p class="role">${QIST.esc(p.title || '')}</p>
        <p class="stage">${QIST.esc(stageLabel(p))}${e}</p>
      </div>
      <p class="org">${QIST.esc(p.institution || '')}${geo}</p>
      <div class="tags">${topics.map(t => `<span class="tag" data-topic="${QIST.esc(t)}">${QIST.esc(t)}</span>`).join('')}</div>
    </div>`;
  }

  function render() {
    writeUrl();
    const shown = filtered();
    $('dir-count').textContent = QIST.t('dir.count', { n: shown.length, total: people.length });
    $('dir-empty').hidden = shown.length > 0;
    $('dir-grid').innerHTML = shown.slice(0, limit).map(card).join('');
    const rest = shown.length - limit;
    $('dir-more').hidden = rest <= 0;
    $('dir-more').textContent = QIST.t('dir.more', { n: Math.min(PAGE, rest) });
  }
  function refilter() { limit = PAGE; render(); }

  /* ---------- the profile dialog ---------- */
  const modal = $('person-modal');
  let lastFocus = null;
  function openPerson(p) {
    lastFocus = document.activeElement;
    const geo = (p.city || p.country)
      ? `<p class="loc">${QIST.icon(QIST.hasPreciseGeo(p) ? 'pin' : 'globe')} ${QIST.esc(QIST.geoLabel(p))}</p>` : '';
    $('person-detail').innerHTML = `
      <div class="pm-head">
        ${QIST.avatarHtml(p, 'pm-avatar')}
        <div>
          <h2 id="person-name">${QIST.esc(p.name)}</h2>
          <p class="role">${QIST.esc(p.title || '')}</p>
          ${geo}
        </div>
      </div>
      <dl class="pm-facts">
        ${p.institution ? `<dt>${QIST.t('dir.m.institution')}</dt><dd>${QIST.esc(p.institution)}</dd>` : ''}
        <dt>${QIST.t('dir.m.stage')}</dt><dd>${QIST.esc(stageLabel(p))}${p.experience ? ` · ${QIST.t('dir.exp.years', { n: p.experience })}` : ''}</dd>
        <dt>${QIST.t('dir.m.fields')}</dt><dd>${QIST.primaryFields(p).map(QIST.esc).join(', ') || '—'}</dd>
      </dl>
      ${(p.topics || []).length ? `<div class="tags pm-tags">${p.topics.map(t => `<span class="tag" data-topic="${QIST.esc(t)}">${QIST.esc(t)}</span>`).join('')}</div>` : ''}
      ${p.bio ? `<p class="pm-bio">${QIST.esc(p.bio)}</p>` : ''}
      <div class="pm-actions">
        ${p.link ? `<a class="btn btn-primary btn-sm" href="${QIST.esc(p.link)}" target="_blank" rel="noopener">${QIST.t('dir.m.profile')} ${QIST.icon('external')}</a>` : ''}
        ${p.lat && p.lng ? `<a class="btn btn-outline btn-sm" href="map.html?person=${encodeURIComponent(p.id)}">${QIST.icon('map')} ${QIST.t('dir.m.map')}</a>` : ''}
      </div>
      <p class="pm-own"><a href="about.html">${QIST.t('dir.m.yours')}</a></p>`;
    modal.classList.add('open');
    writeUrl(p.id);
    modal.querySelector('[data-close]').focus();
  }
  function closePerson() {
    if (!modal.classList.contains('open')) return;
    modal.classList.remove('open');
    writeUrl();
    if (lastFocus) lastFocus.focus();
  }
  modal.addEventListener('click', e => {
    if (e.target === modal || e.target.closest('[data-close]')) return closePerson();
    const tag = e.target.closest('.tag[data-topic]');
    if (tag) { closePerson(); $('f-q').value = tag.dataset.topic; refilter(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePerson(); });

  /* ---------- events ---------- */
  const grid = $('dir-grid');
  function activate(e) {
    const el = e.target.closest('.person');
    if (!el) return;
    const tag = e.target.closest('.tag[data-topic]');
    if (tag) { $('f-q').value = tag.dataset.topic; refilter(); return; }
    openPerson(people.find(p => String(p.id) === el.dataset.id));
  }
  grid.addEventListener('click', activate);
  grid.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(e); } });

  $('f-q').addEventListener('input', refilter);
  ['f-field', 'f-country', 'f-stage', 'f-exp'].forEach(id => $(id).addEventListener('change', refilter));
  const clear = () => { Object.values(IDS).forEach(id => $(id).value = ''); refilter(); };
  $('f-clear').addEventListener('click', clear);
  $('dir-reset').addEventListener('click', clear);
  $('dir-more').addEventListener('click', () => { limit += PAGE; render(); });

  readUrl();
  render();
  const want = initial.get('person');
  if (want) {
    const p = people.find(x => String(x.id) === want);
    if (p) openPerson(p);
  }
})();
</script>
</body>
</html>
